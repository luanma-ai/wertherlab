<link rel="stylesheet" href="../assets/css/main.css">
<style>
  .m-hero {
    padding: clamp(120px, 18vh, 180px) clamp(24px, 6vw, 96px) clamp(36px, 6vh, 60px);
    max-width: 1200px;
    margin: 0 auto;
    border-bottom: 1px solid var(--line-soft);
  }
  .m-hero .back {
    display: inline-block; font-size: 11.5px; letter-spacing: .18em;
    color: var(--text-faint); margin-bottom: 32px; transition: color .3s;
  }
  .m-hero .back:hover { color: var(--warm); }
  .m-hero h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(32px, 5.2vw, 62px);
    letter-spacing: .08em; line-height: 1.15; margin-bottom: 20px;
  }
  .m-hero p { color: var(--text-dim); font-size: 15px; line-height: 2; max-width: 56ch; }

  .m-body {
    max-width: 1200px; margin: 0 auto;
    padding: clamp(40px, 6vh, 70px) clamp(24px, 6vw, 96px) clamp(80px, 12vh, 140px);
  }

  /* ---- 项目索引 ---- */
  .p-index {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: clamp(50px, 8vh, 80px);
  }
  .p-chip {
    font-size: 12.5px; letter-spacing: .1em;
    padding: 8px 16px;
    border: 1px solid var(--line);
    color: var(--text-dim);
    transition: all .35s var(--ease);
    font-family: var(--serif);
  }
  .p-chip:hover { border-color: var(--warm); color: var(--warm); }
  .p-chip.hot { color: var(--warm); border-color: rgba(201,162,39,.3); }

  /* ---- 单项目 ---- */
  .proj {
    padding: clamp(36px, 6vh, 64px) 0;
    border-top: 1px solid var(--line-soft);
  }
  .proj:first-of-type { border-top: none; padding-top: 0; }

  .proj-head {
    display: flex; align-items: baseline; gap: 18px;
    flex-wrap: wrap; margin-bottom: 16px;
  }
  .proj-name {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(22px, 2.8vw, 32px);
    letter-spacing: .06em; color: var(--text);
  }
  .proj-cn { font-size: 13px; color: var(--text-faint); letter-spacing: .1em; }
  .proj-status {
    font-size: 10.5px; letter-spacing: .14em;
    color: var(--warm); border: 1px solid rgba(201,162,39,.28);
    padding: 3px 10px; margin-left: auto;
  }

  .proj-summary {
    font-size: 14.5px; line-height: 2.05;
    color: var(--text-dim); max-width: 62ch; margin-bottom: 20px;
  }

  .proj-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 34px; }
  .proj-tags span {
    font-size: 10.5px; letter-spacing: .12em; color: var(--text-faint);
    background: var(--ink-3); padding: 4px 10px;
  }

  /* ---- 时间线 ---- */
  .tl { position: relative; padding-left: 28px; }
  .tl::before {
    content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px;
    background: linear-gradient(to bottom, var(--warm), var(--line-soft) 18%, var(--line-soft) 90%, transparent);
  }
  .tl-item { position: relative; padding-bottom: 24px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: ""; position: absolute; left: -26px; top: 9px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink); border: 1px solid var(--line);
    transition: all .4s var(--ease);
  }
  .tl-item:hover::before { background: var(--warm); border-color: var(--warm); }
  .tl-item.big::before { width: 10px; height: 10px; left: -28px; background: var(--warm); border-color: var(--warm); }

  .tl-date { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
  .tl-date b {
    font-family: var(--serif); font-size: 15px; font-weight: 400;
    color: var(--text); letter-spacing: .08em;
  }
  .tl-phase { font-size: 10px; letter-spacing: .14em; color: var(--warm); opacity: .8; }
  .tl-what { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 3px; }
  .tl-detail { font-size: 12.5px; color: var(--text-faint); line-height: 1.75; }

  .m-foot {
    margin-top: clamp(50px, 8vh, 80px);
    padding-top: 28px; border-top: 1px solid var(--line-soft);
    font-size: 12.5px; color: var(--text-faint); line-height: 2;
  }
</style>

<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(projects) {
    if (!projects || !projects.length) {
      document.getElementById('projList').innerHTML =
        '<p style="color:var(--text-faint)">还没有项目。</p>';
      return;
    }

    // 索引
    document.getElementById('pIndex').innerHTML = projects.map(function (p) {
      return '<a class="p-chip' + (p.highlight ? ' hot' : '') + '" href="#' + esc(p.slug) + '">' +
        esc(p.name) + '</a>';
    }).join('');

    // 明细
    document.getElementById('projList').innerHTML = projects.map(function (p) {
      var tags = (p.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');

      var tl = (p.timeline || []).map(function (t) {
        return '<div class="tl-item' + (t.big ? ' big' : '') + '">' +
          '<div class="tl-date"><b>' + esc(t.date) + '</b>' +
          (t.phase ? '<span class="tl-phase">' + esc(t.phase) + '</span>' : '') + '</div>' +
          '<div class="tl-what">' + esc(t.what) + '</div>' +
          (t.detail ? '<div class="tl-detail">' + esc(t.detail) + '</div>' : '') +
          '</div>';
      }).join('');

      return '<section class="proj" id="' + esc(p.slug) + '">' +
        '<div class="proj-head">' +
          '<span class="proj-name">' + esc(p.name) + '</span>' +
          (p.cn ? '<span class="proj-cn">' + esc(p.cn) + '</span>' : '') +
          (p.status ? '<span class="proj-status">' + esc(p.status) + '</span>' : '') +
        '</div>' +
        (p.summary ? '<p class="proj-summary">' + esc(p.summary) + '</p>' : '') +
        (tags ? '<div class="proj-tags">' + tags + '</div>' : '') +
        (tl ? '<div class="tl">' + tl + '</div>' : '') +
        '</section>';
    }).join('');
  }

  fetch('../assets/data/projects.json')
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      render(window.__PROJECTS__ || []);
    });
})();
</script>
