 {
  "date": "3月2日",
  "title": "",
  "text": "外面滴着雨。\n上一次我这样的害怕是在我八岁的时候，那时候我整晚整晚的睡不着觉，每当我闭上眼时，静静地感受自己的呼吸，脉搏，生命的律动。我都无法想象有一天我会失去这些，死后的世界是什么样子的，我会像奶奶说的那样一代一代的轮回，在某种不知名的力量下将我的生命力，我的意识，和失去记忆的“我”，我所无比珍惜的灵魂，统统的注入到另一个崭新的生命之中？我无法想象，伴随着对无限未知的恐惧，但我仅仅是害怕，因为我没有办法也没有胆量去深入的思考，去闯入被所有人忌讳的无人之地。\n现在，雨停了，外面没有一丝声音，仅仅的几声汽车轮胎碾压过路面的声音，夹杂着风声，从虚无的一侧驶向另一侧的虚无，我能想象汽车的影子被昏黄的路灯甩在地上，然后被轰鸣着的马达极不情愿拖走的画面。当这仅有的一丝人寰的气息溜走后，我便又被黑夜拽回了虚无。恐惧。\n我不知道一本简单的科幻小说怎么会有这样大的力量，也许是因为他所向我展现的宏大的历史，无限的时间，一场跨越光年的战争，和无比可怜而又卑微的人类自己。将我眼前时间轴上所有在这个时空的琐事统统碾压成了碎片，将这一座座矗立在我眼前的山峦移开，无情的裸露出了我必然的归途，那藏匿在千星之中的黑洞。"

  "date": "4月5日",
  "title": "记",
  "text": "叔本华曾说“生命就是一团欲望，当欲望得不到满足便痛苦，得到满足便无聊。”从这句话中我们可以看出，欲望之于人来说委实是一个重量级的家伙。没有欲望我们就什么都不是，或者说与一颗石子别无两样。当然，在这里我并不是在贬低石子，希望广大的石子朋友不要怨恨在心而趁我出门的时候拌我一脚。总之，欲望无比的重要，也是人类以及所有动物产生快乐或者更严谨点改为愉悦感的前提，当人的欲望来袭时，大脑将这种模糊不清的生理欲望转化为具体可以满足欲望的行为，并且将命令传递给大脑，于是我们的大脑便支使着躯体去完成一系列具体的行为，比如上个厕所或者订个外卖。\n人类的整个发展史也是由一个一个人的小小的欲望在一次又一次的得到满足之后汇集而成的巨大成果。写到这我对我自己的想法感到十分的满意，但满意之余我却依旧总觉得缺少点什么，一些很重要的事情。"
 },
 {
  "date": "4月8日",
  "title": "记",
  "text": "是的，仅仅这样基础的欲望可以维持生命，也可以不断繁衍生息成为数量庞大的种群，但绝不可能成为文明，记得曾经在历史课上老师说过“人与动物的最大区别是制造和使用工具。”于是，我们究其根本，人之所以能够制造和使用工具，是因为人具有其他动物所不具有的大容量的大脑，并且拥有其他动物所并不拥有的独特能力——创造力。\n幸运的是，小时候的我曾拥有一个幸福而宽容的家庭，于是，我在自由的成长环境下拥有了很多独特的经历，也做了很多有趣的小玩意。我永远忘不了当我用积木拼出一个仅仅在我大脑中存在过的飞船模型而感受到的快乐，这种快乐是吃饱喝足所不能比拟的，一种特殊的，恒久的快乐，每当我再次看向我所创造的物品，并且幻想着它真正的运行时，这种快乐便再次来袭，充盈在当时我的小小的心间。\n如果创造也会产生快乐的话，那么产生他的欲望，便可以命名为创造欲。"
 },
 {
  "date": "4月9日",
  "title": "记",
  "text": "每个人都具有求知欲，这是毋庸置疑的，当我们在小的时候，我们对这个未知的世界产生无穷的好奇心，我们会问天空为什么是蓝的，水为什么是绿的，为什么这个世界上既有穷人又有富人，为什么有的人会作恶，有的人会自缢。这些问题涉及着众多的学科，物理学，社会经济学，心理学等等。而这些众多的学科，正是由这些少部分仍保持好奇心的孩子，长大后却没有被司空见惯的现实麻木，没有被已经麻木的成年人同化的孩子们创立。而整个文明的推进，也正是因为这些少之又少的孩子们。\n我本来想写点关于今上午刚想到的另一种独特而又重要的欲望——求知欲的事情，可没想到写着写着就偏到了孩子们身上。但既然这样，我还是要说，如果哪个国家可以有效地保护孩子们的求知欲，哪个国家便掌握了推动时代进程的主动权。"
 },
 {
  "date": "4月11日",
  "title": "",
  "text": "今天莫名的颓废啊，尽管我知道还有很多种欲望等待着我去挖掘，人类还有很多种奇怪的行为等待着我去找到它欲望的根基，但我总也提不起精神来，哎，随便写一点，睡去吧。"
 },
 {
  "date": "4月12日",
  "title": "",
  "text": "我知道我还面对着升学的压力，我还要去面对现实，而现在我所做的一切对我的生活毫无帮助，只是占用着我的宝贵的时间。你问我乱七八糟的做这些事的目的，而事实上我也很难讲清楚，我只是喜欢，好奇，想用自己已知的或自己创造的所谓根本去解释繁杂的现象。的确，他们一直把我当作异类，他们恐惧的看着我，为的是守护他们所引以为傲的，或许是价值观吧，他们所认为重要的东西，可能会被我摧毁，或者仅仅是存在着被摧毁的潜在的可能性，但仅仅是这种可能性，便驱使着他们去远离我。\n我不能怪他们，毕竟他们与我一样也是被欲望驱使的牵线木偶。"
 },
 {
  "date": "4月15日",
  "title": "夸父逐日",
  "text": "我站在这远古的大地上，看到，就在不远处，一个巍峨的巨人正追逐着他头顶上那颗永恒而又昏黄的太阳。\n渐渐的，随着我身边的石子颤抖的越发厉害，他来到了我的身旁。\n“巨人！为何你要忍受着烈日的灼烤，去追逐这颗炽热的太阳？”我大声的冲他喊道。\n他低下那颗硕大的头颅，眯着眼睛找了我好一阵，显然，他盯着太阳已经太久了，几乎看不到什么东西了。\n过了一会，他大概是放弃了，便对着我身旁的那颗石头说到，“你怎么声音这样尖细，就像只蚊子，你刚刚说什么”\n“哦哦，我听到了。为什么？你竟问我为什么，我生而高壮，不就应该去追逐这穹顶上的太阳？”\n“可是”，我说，“总该有些缘由，我是说，追逐他的理由……”\n还没等我说完，他突然狂热了起来，眼睛瞪的就像一颗灼热的太阳，里面充满了可怕的火焰，咆哮道：\n“我生而高壮！就该去追逐！我就该去这样做，别问了，我的族人皆是这样！没有理由！”\n我的心脏快被他那洪钟般的声音震裂，树林里的鸟儿全都被他惊起来，在天上形成了黑压压的一片。这让我想起了那幅《麦田上的乌鸦》。《改》"
 },
 {
  "date": "4月16日",
  "title": "",
  "text": "好的，我知道，我必须努力的前进，不仅仅是为了你们所说的自己的前途，还因为，因为我痛恨那些可恨的嘴脸，那些曾嘲讽过我，用那不屑的目光注视过我的人呐，让我用无比真切的现实回击你们吧！看着，那个曾经的废物，就站在你面前，将你们践踏！\n哎，这卑劣的虚荣，哎，这卑劣的人性。我总还是无法逃脱你的掌控。"
 },
 {
  "date": "4月25日",
  "title": "",
  "text": "我真是笨透了，假如让我去认真的背诵什么东西，我定会焦头烂额却也什么都记不住，但如果并不刻意的去背，而是仅仅每天只读几次，一个星期下来我却能背的滚瓜烂熟。这实在是一种让人疑惑不解的现象，或许是与一些书里说的“大脑会在晚上整理一天所经历的事情和所学的知识\"有关，不过我也说不明白。\n但这种方法有个缺点，当我不过脑子的大声朗读时，这些句子的内在含义我却全然没有顾及到，从而导致背过却除了应付检查和考试其他地方丝毫用不上。"
 },
 {
  "date": "5月2日",
  "title": "",
  "text": "爱情！多么美妙的词汇啊！而就在今天，却真真切切的降临在了我身上。\n她是多么美的不可方物啊，小小的脸蛋上面挂着一副大大的金色眼镜，俏皮的刘海像百老汇舞台的幕布一样将她那美丽动人的眼睛毫无保留的奉献给了我，她不知为何的呆呆望着我，那样的大胆，而当意识到自己眼神的失礼的一瞬间后却又羞的像个不知所措的小猫。天哪，古往今来所有异性的美都一股脑的聚集在她的身上而献给了那时的我。我多么的愉快啊，快乐，幸福，和突如其来的探险般的刺激涌入我的心脏，袭向我未经世事的灵魂。而我，巨大的冲击冲垮了我一贯理性的堤防，汇集到大脑中可累坏了我不常使用的爱情的感受器，于是全部转化为紧张和恐惧，随便整理整理便丢给了我。而我那木讷的四肢呢，却像一个笨拙的，刚出生没多久的小鹿一样，匆匆的逃走了。\n我还会再见到她吗，我不知道，我多么希望答案是“是”啊，无比睿智的神明！让我再看她一眼吧，就仅仅是短促的一眼，也好啊。假如……假如我能得到她……天呐，你疯了吗，你这不知满足的欲望，不知羞耻的思想。"
 },
 {
  "date": "5月5日",
  "title": "",
  "text": "我忘不掉她，每当我安静的坐下，妄图思考，她那美丽的倩影便蛮横的占据了我整个大脑，然后，她那美丽的眼睛、笑容，便将我的灵魂篡夺。"
 },
 {
  "date": "5月7日",
  "title": "",
  "text": "我多么希望……，不，我不能，假如我走向你，去接受你的感情，这将是对我们两个人的不负责任，你知道的，现在是多么重要的时刻，我不能让一个不确定的东西，爱情，来打搅我，也打搅你，我不知道我能不能处理好我们之间的感情，所以我不能向它靠近，我不希望因为我们的某些错误而影响我们的未来，尤其是你的未来，假如出现了问题，影响到了你，我会愧疚一生的，我不能因为我的抉择而使你后悔，假如你对它很看重的话。"
 },
 {
  "date": "5月10日",
  "title": "",
  "text": "《少年维特的烦恼》！瞧我买了一本怎样的好书，我刚看了几眼开头便被维特的言语深深的吸引进去了，多么有趣的思想，而最妙的是，他说的每一种独特的想法或者牢骚我都无比的理解，甚至还有一些我也想过的事情，竟也同样被这样的一位伟人写了出来，我多么快乐啊，就像是在同一位无比了解我的好朋友聊天，也许这就是他们所说的知己吧。只是可惜，这样有趣而又聪慧的一个伟人却已早早的逝去了。\n而我另外买的一本麦田什么什么的，却远远没有维特有趣，甚至可以说是无聊至极，我刚看了几眼就把它丢到废书堆里面让它面壁思过去了。幸亏维特撑起了我对书籍偶然而兴起的兴趣，而使我能够离这令人讨厌的现实远一些，不然假如两本都这样无聊透顶的话，也许我的下一本书就要拖到明年才会再试探性地买一本，还不一定会看的。"
 },
 {
  "date": "5月12日",
  "title": "",
  "text": "每当我拿起这本美妙的书籍时，心情都会变得平静而美好，而我的整个灵魂，仿佛就穿梭进了维特所住的这片伊甸花园，我可以在18世纪欧洲风格的田园小镇中自在游荡，跟随着维特看遍瓦尔海姆的美妙风光，还可以与田间地头可爱的孩童嬉戏，打趣在水井边浣洗衣物的姑娘，当然，还有最重要的，便是……嘿，见到维特朝思暮想的梦中女郎——绿蒂。我相信，假如生活中我能遇到绿蒂这样的姑娘，我也一定会毫无防备的深深的爱上她，她美丽，聪明，善良，并且，最重要的是，她能够独立的思考，有着与维特相同的爱好。天呐，这世界上怎么会有这样完美的女生出现，出现在维特的身边，他多么幸运啊，假如，我能有他一半的幸运…………"
 },
 {
  "date": "5月13日",
  "title": "",
  "text": "我看完了，这叫人怎么忍得住，而现在，我的泪水还被遗忘在眼角没有被拭去，他死去了，永远的死去了，在那圣诞的前夜。我一遍又一遍的看着这短短的几行结尾。脑中却在思考着到底是什么，致使他一步步走向了死亡，是他自己对于感性的放纵吗，还是他们所有人。是的，他们所说的每一句话，每一个字，都深深的刺痛了维特肿胀而又狂热的心脏。维特深深的清楚人类理性的局限性，明白一个人无论如何也不可能永远充满理性的权衡一切。人总归是拥有着情感，拥有着感性的，只是，大多数人并不希望去承认，也不希望人们将其称之为感性之人。感性就这样的可鄙吗，尽管我承认，人们犯错误时，或者称之为侵犯他人的利益时，总是感性在主导者我们。但同样，人类历史上几乎所有的天才之作，却都是这狂傲不羁的感性的所有者所创造。所有的天才，内心总是充满着激情和兴奋，一不小心就会被一些人们所不理解或易感点很低的事物所引燃，于是爆裂出人类文明的天空上的群星璀璨。\n人们总是习惯于去谴责他人在感性的引导下所致使的严重后果，认为这是愚蠢的，是不理性的，当人们看到这个人去杀人了，去偷窃了，便恶语相加，恨不得将其千刀万剐，却不去找找到底是哪些因素的累积使这可怜的人再也无法承受生活的压力，正如维特所说的理性的\"限度\"，当这个限度被逾越时，人的这一点有限的理性便起不到任何作用了。人人都有这个限度啊，当你站在阳光明媚的生活中，眼中充满着未来和欣欣向荣的美好景色时，你怎么可能会理解一个在冰雪中手脚已经被冻僵的人的痛苦，和他所剩无几的残存意识所感受到的绝望。而这可怕的死亡，一切的终结，不就正明明白白的展现在他的面前吗，他要去尽力的改变这一切啊，用尽一切办法，或者不择手段。\n人是有精神和物质的双重属性的啊，当一个病人病入膏肓而所做出的一切努力你们称之为积极，而当一个人几近崩溃所尽可能的做出的努力你们却称之为疯狂。当病人患病死去了你们流着泪将其安葬，而另一个人抑郁成疾从而选择的死亡却\"没有任何教士来替他送葬\"。"
 },
 {
  "date": "5月14日",
  "title": "",
  "text": "我明白，人的欲望是无法相通的，情感也是。因为我们每个人自己的身体只能产生属于自己的欲望，于是每个人都不可避免的走向自己，不可避免的自私，永远都在想着我到底该怎么做才能，从最初的活下去，到现在的快乐。于是，我们无法理解别人的由欲望的满足与否所产生的情感。除非他自身真正的经历过，感受过，也深陷其中无法自拔过。\n于是，我不再苛求别人可以理解我，理解我的痛苦和不安，因为这本身基于他们便是不可能的。"
 },
 {
  "date": "5月17日",
  "title": "",
  "text": "维特呵，正如你所言，当一种疾病严重损害我们的健康，改变了我们的生活轨迹，并且绝无复原的可能性时，这种病症便被我们称为“死症”。而我一直以来所染的，便是这样的一种病症吧。"
 },
 {
  "date": "5月19日",
  "title": "",
  "text": "你可真是优柔寡断，明明不能再与她靠近，但当你碰到她时却又用那可恶的眼睛直愣愣的盯着她，回应她，告诉她你喜欢她。可是难道你看到这样美丽又可爱的人儿能够目不斜视，坐怀不乱吗，还有啊，你叫我怎么直接了当的拒绝她，我们难道能说上话吗，你根本不认识她，你只能保持不变。伤害她？给她一个恶狠狠的眼神？天呐，你可真是个恶魔，难道你忍心伤害她一丝一毫吗？绝不能，我做不到……做不到。"
 },
 {
  "date": "5月20日",
  "title": "",
  "text": "我又见到她了，这几天，她似乎在尝试着靠近我，又或仅仅是我自己的主观臆断，痴心妄想，但……当我在食堂见到她一次后，以后便似乎总能在同一地点和时间看到她，体育场也是，还有还有……，也许是我想的太多了，毕竟……一直以来我真的太累了，不想坚持了，但我的前途，我的学业，都在促使着我，强迫着我呆在人群中，我知道，你们讨厌我。厌烦和不耐烦都写在你们的眼中了，我真希望我没有这样敏锐的洞察力，真希望是个毫无情商的呆瓜，这样我就能不那么在意你们的目光，你们的情绪，和对我的恨意。这样我或许会活得快乐一些，哪怕一点点。"
 },
 {
  "date": "5月21日",
  "title": "",
  "text": "真是挺奇怪的，难道世界上真的存在着某种像缘分一样的东西？把我们捆在一起，一天见不到都不行？\n显然，当我看到她之前，她便发现了我，因为这会她已经低下了头，两只美丽的眼睛紧紧的盯着脚前的塑胶地面，鹅黄色小巧的脸上早已泛起了一丝绯红。然后，额上的两缕分开的刘海毫无凭借的随着她的步伐有规律的上下浮动，当然，脑后的小马尾也一样。她就这样匆匆的，快速的，像只看到食物却碍于面子不便于撒欢的小猫一样的，溜掉了。"
 },
 {
  "date": "5月27日",
  "title": "",
  "text": "这可恶的逆反心，病使我内心中潜在的逆反心凸显了出来，变得越发碍眼，我开始恐惧于直视他人的眼睛，甚至于我视野中的所有眼睛。因为我知道当我看到别人的眼睛时，我就成为了特殊的一个，我的行为便全都暴露在了目光中，我知道我的行为并不会给他们带来对我的厌恶，但我却担心我会做出使他们厌恶的事情，我告诉自己，我不能对着她们咽唾沫，不能怎样怎样，因为这会使他们误以为我是一个变态，令人厌恶的人。但我的逆反心！这可恶的不孝子，竟使我唾液越分泌越多，直到无法忍受，终于，我失败了，我不敢看她们的眼睛，她们厌恶的神情，我一遍又一遍的咒骂自己，却毫无作用。\n还有很多出格的行为，像个疯子一样的行为，使我饱受折磨，但我不想写在这，我不想承认我曾做过这些事情，也不想去回忆，再经历一遍这折磨人的酷刑。\n而现在，我的眼中已经出现了一个阴暗的前景——离开。"
 },
 {
  "date": "5月29日",
  "title": "",
  "text": "哈哈，原来连你们都在赶我走呢，可恶的蚊子，苍蝇，臭虫，让我安静的睡一觉吧。还有宿舍里闷热潮湿的床单，被褥。离开，是时候该下定决心了，假如，对，假如明天你能安排让我再见她一面，便就是告诉我，我该离开了，准备好一切，至于学业，我可以去试着自学，毕竟在我的计划中老师除了能够问问题以外其他的我都可以自己做到，按照计划，方法，严格的执行，问题应该不大。就这样吧，神啊，现在一切就看你的了。"
 },
 {
  "date": "5月30日",
  "title": "",
  "text": "再见了，你们！直到下学期。假如在这个暑假，当我我试尽所有的办法之前，我的病能够痊愈，我就会回来的，假如不能，不，不，不会的，这么长的时间总能治好的，一定能，求求你了，让我痊愈吧，如果我不能继续前进而止步于此的话，我就完了，彻底的完了，你也一定不希望我变成那个样子的吧。只是，我走后，她在那约定好的地点再也见不到我，大概会很难过吧，对不起了，我别无选择，对不起。\n6月10号\n看来是我高估了我自己的自控能力了，在家里我永远也拿不出百分之百的精力来思考、总结题型和套路。我感兴趣的东西太多了，却也永远轮不到学习上。细想想，大概一是没有氛围，二是没有那么热爱。如此看来，对于没有那么感兴趣的东西来说，自学的确是一条歧路，这样是行不通的。"
 },
 {
  "date": "6月16日",
  "title": "",
  "text": "没事，没事，你就知道说没事，难道现在的仪器没有检测出结果就没有问题，难道只有问题摆在你面前了，皮肤溃烂了，化脓了，人发疯了，你才明白，“奥，原来事情这样严重啊。”难道你就没有丝毫的探索精神和好奇心？只是一味的相信机器的结果，难道你就这样相信你所学的知识，崇敬这些知识。学完后便拍拍胸膛说，“哦，我已经学贯中西了。”然后抱着一种不可置喙的心态俯视着万物，享受着崇拜者羡慕的目光。是的，这样看来，知识已经成为了你沽名钓誉的工具罢了。而你却从未想过人类这样的初级文明对于知识的了解是多么的浅薄，多么的有限，现实中多少的现象是人类所无法解释的。哦我知道，这世界上怎么能有让你难堪的事物存在呢，草草的敷衍过去便是，打消那些不明白的求知者的好奇心，也总比让他们明白自己也有在自己专业上不清楚的事情存在好啊。"
 },
 {
  "date": "6月18日",
  "title": "吴刚伐桂",
  "text": "拨开眼前这片七色祥云，我看到一个锦绣华衣之人，挥动着一把硕大无比的盘龙神斧，正砍向那参天桂木。他便是那神话中的吴刚吧，我想。\n“嘿，大神，你为何要无休无止的伐这桂木？”\n他木讷的看来我一眼，但很快又把眼神放回来那个不断愈合的缺口上。\n“我只有在伐这桂树之时才为神，一旦停下，就与尔等无异。”\n“难道你不想做些其他的事情？”我问道。\n“想，当然想，我除去永恒的寿命与凡人无异，七情六欲我皆具，但……”\n他稍停了片刻，我看得出他在思考，但那斧头却依旧在不停的挥动。\n“不能，我停不下，你看，我的身体已具备惯性，还有……”他的声音明显低了下来，“我听那兔子曾向我谈及，下界已为我修祠，香火不断，我怎能突然放弃？”\n我正想多问他几句，不料突然，我簌的跌入了黑暗，眼前重现这寰宇。"
 },
 {
  "date": "6月20日",
  "title": "",
  "text": "村上春树笔下的人物可真是个怪人，说话也怪，行事也怪，对于现实中突如其来的（我们认为的）大事也木讷的可以，就算是欢乐的场景也总透露出一种超脱的冷漠。我在读的时候心里总是弥漫着一种悲伤，不至于让人留下泪，却是一种挥之不去的悲伤。仿佛灵魂永远伫立在生命的尽头，目光看向现在的在尘世中的自己而露出的一丝惨淡的微笑。\n还有规则，所有规则和教条仿佛都失去了作用，他所唯一崇尚的大概只有自己规律而又平凡的生活。"
 },
 {
  "date": "6月23日",
  "title": "",
  "text": "当我看到绿子的父亲身患重病倒床不起，所有的医疗和救助都仅仅是在维持着他极其虚弱的生命，并且就算短暂的好转也不可能恢复原样时，我不禁想到假如是我，我也许会选择及时的结束生命，因为我看见，接下来的日子里尽是被病痛折磨痛苦，既然一定会死，而且未来也不会再有快乐出现，不如及时终止掉生命，既可以为自己少经历点痛苦，还能为社会节省一部分不必要的资源，如果我并不富裕，这样或许还可以让自己的儿女过的更好一点。实现自己最后的一点社会价值。\n或许，对于人来说，最幸福的事情莫过于在毫无察觉中死去，毫无恐惧，毫无痛苦，临死前还包含着对于明天的憧憬和希望。就这样在梦境中突然的，自然的，毫无痕迹的被死神抹去意识，就如同将生揉进了死亡。这大概是死神所能给予的唯一的最宝贵的馈赠。"
 },
 {
  "date": "6月24日",
  "title": "",
  "text": "黄瓜紫菜蘸酱油莫非就这么好吃不成？"
 },
 {
  "date": "6月29日",
  "title": "",
  "text": "“人之初，性本善，性相近，习相远。”当我放假在亲戚家教小孩背三字经时，又怀着把一切摧毁后重建的心情重新思考了这句话的含义。何为善？就是做好事，而做好事又意味着什么？意味着去做符合别人利益满足别人欲望使别人快乐的事。难道人天生就会做符合别人利益的事吗？我想回答是否定的，人在婴儿的时候，最基本的需求就是吃饭睡觉还有排泄。至于这个结论是从何而来的，我还要感谢他的妈妈，因为当我在照顾孩子之前，它的妈妈就对我说，“如果它哭了（在这里就是翻译成他现在存在需求），不是拉了就是饿了，还有可能是打盹了。”那么，当孩子做这种事情的时候又是否能被成为恶呢？显然也不是。于是，我们或许就可以得出结论，孩子从小只有最基本的欲望而并无善恶之分，最多只是性格不同。那么孩子又是怎么从一个既非善又非恶的生物，渐渐出现了善或者恶的雏形呢？"
 },
 {
  "date": "7月3日",
  "title": "",
  "text": "我曾经被迫旁听我们班级里的同学聊天时，发现了一个问题，他对着他的朋友骄傲的说：“我现在打架已经还算可以了，年级里的人也认识了不少，穿的衣服基本上都是名牌，现在就缺个摩托车了。”而这时我心中突然升起了一个疑问，到底是什么促使他明确自己需要什么？\n当我思考了半响后才发现，正是榜样的力量。当人们在晚上的某个静谧的时候总会不经意间结合实际想想自己到底要成为一个什么样的人，假如学习稍好点对于自己的定位便是学霸，而学霸是个什么样子呢？带着眼镜，门门第一，假如层次再高一些便还要是个班级干部，与同学关系好，与老师关系更好，再高一点便还要会很多兴趣，钢琴十级，葫芦丝八级，再加上各种比赛的证书，如果硬要再高一点也不是不可以，但并不是每个人都天生具有的，便是一个令人羡慕的官员或者老板老爸，财大气粗，一掷千金。我想这时候大概就会是所有人羡慕的完美对象了吧，奥对了，还要有一尊倾城面容。尽管并不是所有人对自己的定位都是学霸，但假如是这样定位的我想便一定都在上述的某个阶段中奋斗。\n不仅如此，这个世界上还有许许多多的完美标准，而每个标准都值得人们奋斗一生，并且，正是这些朦朦胧胧的标准，不断地去框着一个孩子向前走的道路。那么这些标准最初是怎样到达孩子们的心里的呢？\n是环境，每个孩子的生长环境不同，家长的性格不同，而家长所崇敬的人也不同，于是在孩子们的慢慢成长中，在环境的耳濡目染中，当然还有家长们的不经意间给孩子所扣的帽子中，都渐渐形成了孩子们自己的个人定位，比如皮孩子，乖宝宝，等等。正是这些定位，使一个孩子渐渐的变成了不一样的人。但同时，假如这个孩子的天性与他所耳濡目染的定位不同，并且因为天赋的差异使他没有办法在这个定位上走的足够远，于是他便开始迷茫，开始反叛，并开始寻找属于自己的路。\n一个好的个人定位固然可以督促和矫正一个人的成长，但假如所有人都去追求一个相同定位，一个所有人都认为好的定位，这种情况下往往会使没有相关天赋的人自甘堕落，有相关天赋的人洋洋自得，然后一旦没有独立思考的能力便很有可能被虚荣吞噬，并最终失去自我。"
 },
 {
  "date": "7月10日",
  "title": "",
  "text": "那么我对自己的定位又是怎样的呢？小时候当我在看史记和一些人物传记时，我总是深深的迷恋于那种古时春秋战国时期的士人，也许是因为他们一直以来都是像欧洲的“绅士”一样有着一种所有人都崇敬和敬重的舆论环境，又或许是我心中的“要做就做最好的那种人”的精神信条，使我对于这种君子风度有着一种近乎迷恋的暧昧态度。我希望去成为这样的有着“有匪君子，如切如磋，如琢如磨”的翩翩风度，“修身齐家治国平天下”的崇高理想，还有“安能摧眉折腰事权贵，使我不得开心颜”的不屈脊梁的人。无数的朦朦胧胧的“君子该怎么做”和“不该怎么做”在我做每个选择的时候出现，决定着我的人生走向和性格。但仿佛现在这个时代的君子少了，也仿佛没有人去崇敬，去以之为榜样了，现在所有人都在争着抢着站在时代的镁光灯下享受着耀眼瞩目的光芒，抢着成为人上人，抢着去评比，除了科学家和艺术家中的少数人，已经鲜有人去认真的做好一件事了。"
 },
 {
  "date": "7月17日",
  "title": "",
  "text": "人性是存在着恶的种子的，尽管我并不愿意去承认。当我陪着孩子玩耍，用积木搭建了一个稳定结构时，他却趁我不在意将其推到了，虽然我并不生气，但我的心里却浮现出一层深深的忧虑，是哪一种欲望支使着他做了这样的事情呢？推倒象征着毁灭，是一个熵增的过程，当创造欲使我们做出符合美感的熵减行为时，我们会产生成就感。而毁灭，则是一种单纯的野蛮的快感。假如说毁灭欲和创造欲，是对立性所管辖的结果，那么与求知欲相对的，大概就是起反作用的懒惰。"
 },
 {
  "date": "7月29日",
  "title": "",
  "text": "我回老家了，带着我的《约翰·克里斯朵夫》，或许对于我来说，回到乡村中，在树林里，田埂里，山上，河边，这种人烟稀少的地方，亲近大自然的地方，会对我的病情会好一些，就像维特那样，散一散心。\n我曾不止一次的这样认为，像人这种散发着欲望气息的东西，一定要定期的来到风中，自然中清洗一下身体，也清洗一下灵魂。这样才能让人不至于太过于沉溺于社会生活中的得失。当人没完没了的与人打交道，这个人便会被没完没了的欲望浸染，从而成为一个每时每刻都在被欲望赶着匆匆前行的瞎马、聋马。假如一个人永远都在追求着强烈的刺激而不能欣赏恬淡而又美好的艺术刺激，那么这个人也一定是过不好这一生的。同时我还无比的坚信，一个热爱自然并且能够欣赏自然的人，必定是一个善良的人，也必定是一个对社会有用的人。"
 },
 {
  "date": "8月1日",
  "title": "",
  "text": "农村的生活还算惬意，总比我在人群中所感受到的局促感和没完没了的恐惧要强。当我爬上山时已经八点了，天气还算说得过去，除了风大了点。我本打算在山顶上的一处我早就勘察好的储水池顶上细细的品味我的克里斯朵夫，但当我到了之后才发现，这里的风大的几乎能吹翻一座破房子，我硬着头皮读了一会后便发现，这内容他根本不进脑子，耳边脑子里都是呜呜呜的风声，实在没办法只好悻悻的从储水池顶上爬下来，心思着在山上随便溜达溜达算了。但令我惊奇的是，当我独辟蹊径随便找了一条小路下到半山腰的时候，却发现了一个完美的地方，一个隐蔽的“世外桃源”。这个“世外桃源”在小路上是看不到里面的，而是有一个高高大大的土坡挡着，土坡与路之间有一段距离，无论是土坡还是与路的之间都长满了茂密的杂草，从土坡旁边的低矮处爬到里面可以看到，土坡的后面长着一颗不知是人故意栽种的还是自然形成的老树，我也叫不上名字，只是看见它从土坡的后面延伸出来，盘根错节的向外伸展开，红色的花朵密密麻麻的点缀在枝头，而在树的下方则是一片由石头围成的极嫩极嫩的草地，草芽嫩的仿佛能掐出水来，与周围略显枯黄的草地形成了强烈的反差，由于这片草地的特殊性，使我一度认为这个地方在夏天的涝季可能曾是一片小池塘，不过后来想了想才发现这是在山上，就算有地下水也不可能出现在这么高的地方，便不再去想。我在草地旁的一块简直就是在为我歇脚而准备的凸起的岩石上坐下，静静的望着这四周，有草、树、花，还有能够给予我充足的安全感的三面的环山，就算是那狂暴的风伯也被格挡在外。我的心里产生了一种久违的平静，一种和谐，一种就算在这里躺下睡一觉也不会有人发现或有危险的弥足的安全感。这使我永远都在紧张永远都在恐惧的心终于放松了一次，彻底的放松了一次。\n等我醒来已经是下午三点了，尽管夏季的天比较长，天色一点没有变暗的趋向，但我饿的咕咕叫的肚子还是提醒着我该回去了，我慢慢的爬上了略高于地面的山与土堆之间的峡口，又重新回望了一遍这美丽的景色，树上的花儿依旧在随着微风的轻抚微微颤动，地上的草儿无比休闲的享受着属于它们的夏日时光。"
 },
 {
  "date": "8月3日",
  "title": "",
  "text": "我从小就喜欢和小狗小猫呆在一起，轻轻的抚摸着他们软软的绒绒的毛，小猫发出呼噜噜的声响，小狗便直接大咧咧的将肚皮翻给我，期待着我的抚摸。与他们在一起远比与人们呆在一起要舒服的多，因为他们不会因为我的一个行为而心生厌恶，他们的潜意识中也不会有巨大的框架，人类文明所代代相传的某种奇怪的规范，在社会生活中耳濡目染而根深蒂固的行为准则，被我不小心逾越。我在他们身旁所感受到的是自由，一种令人放松的愉悦感。他们对于自己不理解的事情不会立即判断，下定义，扣帽子，而是细细的观察，或者不做思考，只要对他没有根本的威胁。而事实上我看到，那些真正的智者也会慢慢的去分析和思考，用包容的心去理解它，而不会立即产生一种对于框架外的敌对情绪。某种意义上说，这也包含于物极必反这一民间所总结的基本共识之中，从而导致随着事物的不断发展，最初与终极竟显现出相同的性质，写到这，我的脑中不禁想起了前不久看过的宇宙大爆炸理论，从奇点诞生最后并归于奇点的可能。"
 },
 {
  "date": "8月4日",
  "title": "",
  "text": "罗曼罗兰先生在我心中的地位已经仅次于歌德了！我喜欢他讲故事的方式，总是独特且有趣，好像随时随刻都能在下一个句子中看到看到一个有趣且独特的思想，他的每一个句子都充满灵性，每一个句子都映射出他的伟大而智慧的灵魂。他不只是一个好的小说家，还是一个好的思想家，好的社会科学家。"
 },
 {
  "date": "8月9日",
  "title": "",
  "text": "我准备离开了，我不知道我在这里的短短几天对我的病情有什么作用，但总的来说还是至少放松了一下，我尝试着让自己尽可能的不去乱想，保持着一种对任何事都不关心的规律的生活，每天早早的起床，然后吃一碗奶奶煮的热腾腾的清汤面，还有几个煮好的鸡蛋，然后就上山去到我可爱的秘密花园里读我的约翰克里斯朵夫，感受着在几百年前的他在莱茵河畔所经历的回环激荡的一生。到了中午便吃我在书包里早早准备好的早上的鸡蛋、几块咸肉和一个馒头。下午空气变得冷起来了就下山。在读书中难免不想读了的时候我就会到山顶逛一逛，看看漫山遍野的油菜花田，莅临指导一下树下蚂蚁和花丛中嗡嗡嘤嘤的蜜蜂的工作。"
 },
 {
  "date": "8月10日",
  "title": "",
  "text": "我的奶奶从小就喜欢我，听说以前我小时候曾经在这里住过很长一段时间，不过现在我已经什么也不记得了。每当我回老家的时候，奶奶都会开心的不得了，对着我又亲又啃，啃其实就是啃耳朵，据说是我以前经常和奶奶一起玩的游戏。然后拉着我坐在床沿揽着我一声又一声“狗蛋儿啊”“狗蛋儿啊”的叫着，而我总是理直气壮的要奶奶改口，叫“蛇蛋儿”，因为我是属蛇的，据说也是从小的毛病。当然奶奶也顺从的改口，但下一次来我却还是个狗蛋。\n而现在奶奶就在我屋子的门外忙前忙后的给我准备走的时候要带走的东西，方便面了奶了什么的统统都带上，当然还少不了一大袋子刚煮好的鸡蛋，用凉水拔过的，好扒皮。我也不知道奶奶为什么这么喜欢我，但我却从来不能给予她足够的等价的情感反馈，这让我一直以来都感觉无比的惭愧，却不知道以何报答，不过我想或许只要不抗拒能够让她一直一直的开心就足够了吧。"
 },

 {
  "date": "8月14日",
  "title": "",
  "text": "这些迂腐的老古董啊，为什么会对于性如此的抗拒和不齿，明明性欲只是一种为了让物种需要去繁衍的方法，与食欲相同的获取物种存在与延续的方式。但人们对于性却总有一种讳莫如深的抗拒感，人们谈论吃饭会津津有味，但却恐惧于谈论性，公开的谈论性甚至会被人冠以轻浮和不正的帽子。\n是的，曾经的性欲不会像食欲一样吃完饭便可以出门遛弯了，性欲的满足背后还隐藏着深深的责任，与人类初期厚重的宗族和家庭关系密不可分，再加上使亚当围上草裙的羞耻心的综合作用，这样的近乎于仇视性欲的风尚也是可以理解的。但现在不同了，随着避孕措施的逐渐完善和宗族关系的消解，性已经不应当被作为一个洪水猛兽，而是一种正当的需求，应当被予正视和教育体系的接纳。\n在过去，人们对食欲的需求诞生了餐馆，酒楼。而对于性欲的需求则诞生了妓院和窑子，这是随着资本的产生和发展所必然诞生的事情，但既然是资本产生的，就必然会有大资本家的操控，并且存在着强迫卖淫的可能性，这种可能性会导致类似于人口买卖的将人物化的倾向。除非妓院能够得到严格管控，并且得到资格证一类政府颁发的东西，再加上民间的没有证件就很可能会被传染性病艾滋病的强大舆论倾向，关键还要保证证件的颁发方面不出问题，不会被资本胁迫，否则娼妓的合法化就现在而言是不合适的。\n但人的性欲是一种自然的需求不是吗，如果只有没完没了的堵塞却没有一种合理的排解的方式，人会因此误入歧途的，人会像一只被光源引诱的蛾子，不择手段，想尽一切办法去释放自己被压迫的欲望，从而去做一些逾越法律践踏人性的行为。\n那么到底是什么在压迫着我们的欲望呢？是社会，是舆论，是每个被自己内心戒律教条深深束缚的人，是那些不思考合理性只是依靠着自己的第一印象和情绪去判断一件事情正误并为之无理辩驳的人们，他们的潜意识里希望社会一成不变，希望这个世界海清河晏，每个人都做着他所希望的所认可的事情，但凡出现一个特殊的，与常理不同，与他的认知相反的事情就大肆抨击，然后大发感叹世风日下人心败坏。但现实往往不是绝对的，一切都在找寻一个平衡的点，一旦某些事情变得绝对了，就一定会有一股力量来将其毁灭。\n或许我又跑题了，但对于这个问题我曾经看过一篇文章是这样回答的：“要消灭职业性的娼妓制度的最好方法，是使青年得到更大的自由，这种自由近些年在不断地增长着。”\n至于性教育我曾听过这样一种说法，认为不应让孩子过早的接触性。但我所认为的却与之恰恰相反，在孩子们还没有对于性产生更多的好奇心和想法的时候就给予他们以性教育，告诉他们性的重要性和神圣，于是当他们在性成熟的年纪再接触它的时候就不会再产生过多的好奇心和探索的欲望，正如当我与死亡正面接触后，当我在这些伟大的哲学家的带领下亲自认认真真的思考了一番死亡后，死亡便对我没有那么大的影响力了，有时候半夜想起来也会因为实在没得思考了而感到无趣，从而合理的疏导了好奇心。\n但现在让我难过的是少有人对于性教育感兴趣，因为一个社会的劳动者不需要性，所以他们便认为没必要，也没有紧迫感。但是假如大多数人能够把孩子们当作人来看，把培养孩子当作培养一个人，而不是劳动力，考虑孩子们需要掌握什么的时候不是把他当作一个社会的组成部分，不是因为社会需要什么，才告诉他需要什么，而是尽可能地把孩子们作为一个人的自然属性和社会属性平衡起来，让他们在符合社会需要的同时能够符合他自己人的发展方向。尽管我知道正如那篇文章最后所说；“只有世界成为一个经济的、政治的统一单位后，个人教育才能够复兴”，但我只是建议，人们能够多关注一下这些在资本家看来毫无作用的事情，因为只有这样，中国才能够真正的复兴，中国少年才能够真正崛起。"
 },
 {
  "date": "8月15日",
  "title": "",
  "text": "这段时间我一直都在努力的去治疗我的病，无论是中医还是西医，我都尝试了一遍，这会儿啊，我正熬着一大锅中药呢，浓浓的一锅，味道又苦又涩，空气中仿佛每立方米都充斥着一百吨的中药微粒，但……假如能治好我这顽疾，再苦的药我也能喝下去啊！为了她，为了自己！\n噁……苦死了，里面有好多黄连吧。我都承受了这样苦了，我的病啊，赶紧好吧。"
 },
 {
  "date": "8月17日",
  "title": "鲧禹治水",
  "text": "洪水漫天，陆地只留下了几个山峰的尖尖，其他全是水。\n我降落在一座山的南面，远远的看到，一个男人蹲坐在一块青石上，青石上长着不少苔藓，我不知道他光着脚是怎么蹲在上面的。他掩着面，肩膀一抽一抽的，像是在哭泣。我走进他，显然，他哭的相当投入，丝毫没有注意到我的存在。\n“你怎么了？”我凑近他问道。\n他突然止住了哭声，惊恐的回过头来看了我一眼，赶忙胡乱的用袖子摸了两把脸，朝我笑了笑，便又慢慢的回过了头去，眼睛望着遥远的天边说道：“我完了，马上就要死了，帝已经把祝融派来取我的首级了。”\n我刚要问点什么，他却又继续说道，\n“可是我怎么也想不明白，为什么我就失败了呢？我治水九年，怎么说也应该有点效果了”\n他似乎注意到了我的缄默，回过头来看了看我疑惑的神情，顿了顿，问道，\n“你可知神州水妖肆虐之事？”\n我怕暴露出自己的身份，赶紧点了点头。\n“那就行，我是鲧，是个治水官”\n我一惊，又仔细端详了一番这个粗布短裳的彪形大汉，身高大概七尺有余，两条裸露的胳膊被太阳灼烤的又红又黑，脚很厚重，指甲已经不见了，只剩下光秃秃的脚趾头显得有些瘆人，一看就是被水浸泡了过久的样子。总之怎么也不像是个当官的。\n“那么，你失败了？”我问道\n他沉默了一会，说：\n“我怎么也想不明白，水来土掩天经地义，为什么我却永远都无法彻底的将所有水都挡住呢，水高一寸，我便将土堤加高一尺，可无论我怎么努力的加高堤防，水却永远都跟随在我们堤防的下面，直到我们所有人筋疲力竭，它便猛地越过大堤，把我们身后刚重建起的村庄再次吞没，可怜那些信任我的将士们，但我想着不就是我加高堤防的速度没有它快嘛，后来一次偶然的机会我听说天帝有一种神土名曰息壤，能够变大变小神力无穷，我一听说有如此宝物，便想办法窃来以治水患。”\n“窃天帝的神物难道不是死罪吗”我忍不住打断他，\n“是死罪是没错，但我治水一旦失败也定是死罪，不如赌一把。但这息壤实在是太少了，洪水滔天整个神州大陆皆是一片浩浩汤汤，又岂是这一丝一毫能够堵塞的了的，神土也莫过如此，于是我便放弃了。”\n尽管我早已听说过这些事情，但我也同时具备着后世一代一代人对他的分析，于是我试图开导他，让他死的明白一些。\n“我说，你知不知道为啥治不好这水？”\n他愣了一下，奇怪的摇了摇头。\n“你说这是水妖，那你为何不把他们引到其他地方，就知道没头没脑的堵啊堵啊，难道你能把它凭空堵没不成？你看，你在这堵了，其他地方便又冒出来，刚刚集市那边的堵住了，它却又去皇城扎一头，这你可要堵到何时啊？”\n他叹了口气“哼，说的到轻巧，这些我又何尝没有想过，你可知水妖乃至奸至邪之属，前些年我还没治水那会，就曾亲眼见着它诱那小孩下水，然后一口吞掉，乡里乡外的会水的人下水没有一个能活着回来的，据说都是让那水妖给吃了，可怜那小孩，年纪轻轻…………”说到这他眼圈居然又湿润了，一颗颗大金豆子从他那老脸上比赛似的滚了下来，他没顾得上摸，便又说“你看，这水妖可谓是坏事做尽，每当想起我便恨得咬牙切齿，单单看到个小水洼，我就歹踩一脚才解气，你竟说像个大爷似的把它请走，难道让它继续害人不成？”\n他气愤的朝我甩了个脸色，没注意到，祝融已经在此地等候良久了。祝融向他使了个眼色，他瞧见了，长叹了一口气，便随他走了。"
 },

 {

  "date": "9月21日",
  "title": "",
  "text": "摘抄《月亮与六便士》：\n“这种生活模式给人以家的温馨。……，我总觉得大多数人以这样的方式度过一生，好像欠缺了点什么。我承认这种生活的社会价值。我从中看到了有序、平静和幸福，但我的血液中却涌动着狂烈的欲望，要走一条不受羁缚的道路。”\n原来，一个人还可以这样生存，我看到了一个人的肉体欲望被压缩到了极限，而精神欲望，却无限的漫展开来，将灵魂包裹。我希望自己也可以这样，也许我也可以成为这样，不顾一切，任何人的看法和评价。只顾去追寻，舍弃一切的去追寻自己心中的信仰和希望。而不是没头没脑的去努力，去追求别人赞许的目光，社会地位，以及自己心中所暗藏的虚荣的恶魔。列夫托尔斯泰所深恶痛绝的魔鬼。"
 },
 {
  "date": "9月23日",
  "title": "",
  "text": "但我做不到，我没法做到像思特里克兰德那样毫不在乎别人对他的看法，他似乎就是一个机器，一个生产艺术的机器，当他感知到他心中火热的需求，所要做的事情，他便开始俯下身子轰隆轰隆的运作起来，无论环境怎样，只要他活着，便生产。而我却终究还是没法做到这样，他是个天才，而我不是。我需要环境，需要动力，需要大量的外在条件，而他却只需要一罐油彩和一张画布。"
 },
 {
  "date": "9月25日",
  "title": "",
  "text": "艺术？什么是艺术，艺术就是情感，是儿时的啼哭，少年的爱恋，是当我们站于珠峰之上泰山之巅所看到的冰原陡峡，落日残照。也是当我们历尽人世沧桑，风起云涌后的低眉长叹，垂泪宫娥。是战争的惨烈，战后的荣光。也是教堂的咏叹，对神明的无上的敬仰。艺术是一切一切情感的总和，是激情与悲哀的产物，是恐惧与愤怒的歌。而假如我们要衡量一个艺术的成功与否，我想便是是否将情感成功的传递，是否能够引起人们感情的共鸣，对于美的自然的理解和唤起我们对于往事的回忆。我们喜欢直接的艺术也更喜欢情感间接的表达，因为朦胧又神秘的东西会引起人无限的遐想，而每一种来自艺术的感受者自身的遐想，往往有时候却显得比作者的意图更加的重要和美好。"
 },
 {
  "date": "9月26日",
  "title": "",
  "text": "会议记录：\n1.有战略，有战术“上为之，下效之”。\n2.沟通的时候要注意方式方法，声情并茂，以理化之。\n3.慢慢的增大难度，使其有成就感……\n真热啊，热的让人无法喘息，又闷又热，惶恐，不尽的惶恐，一声声喘息都是利刃，是锋芒，散发着寒光！又带着倒刺。致人于死地啊，不，他们要你灵魂的血，又要保全你肉体的苟且！"
 },
 {
  "date": "9月27日",
  "title": "",
  "text": "随着我看的书籍的增多，尽管我很不愿意，但我竟渐渐的对于社会体制产生了兴趣。列夫托尔斯泰一生都在用尽全力去试图改变当时那个腐朽的社会，改变那个被文明掩饰的疤痕“‘他叫喊起来，痛哭不已，挥舞着拳头。’‘人不能这么生活呀！’他抽泣着说，‘这种情况不允许存在！不允许存在！……’”这种可怕的同理心牵动着他也牵动着我，是的，不能！为什么这个社会上存在着可悲的穷人，可怜的弱者，他们也只是一个个单纯的彻底的被欲望所控制着的孩子啊，他们的大脑结构，天性和可悲的现状都注定着他们是现在这个社会最底层的弱者，但我不希望看到这样的一个个灵魂被肉体所折磨。难道他们不会产生社会价值吗，不是的，我无比坚信每个人的存在都有他的意义，我们所有人在出生时都被上帝吻过，赋予了我们的特长，我们独特的感受快乐的方式。而这些所谓的弱者，穷人。仅仅是因为他们没有找到，没有找到他们心中深藏的神的花朵。他们之所以为弱者，仅仅是因为他们被社会淘汰了，被千篇一律的选拔淘汰了。就如同拿着不趁手的工具工作，永远也赶不上其他的其他人。我们没有办法换个工具，我们只能去换个自己擅长的，喜欢的工作。从而使我们的社会价值最大化。（改）"
 },
 {
  "date": "9月30日",
  "title": "",
  "text": "你像蝴蝶一样翩翩，飞进我的心田。\n为什么，为什么又让我见到了她，为什么要见我。像一只春天的小熊一样从我的身边跑过，脸上洋溢着快乐的笑容。在我正低眉沉思的时候，在我正满目忧伤，所视尽萧条的时候，她的身影又一次闯了进来，像潮水冲破了我所筑的堤防。一直以来，我都将我的心锁死，拿着盾牌和长枪提防着我身边的所有人，用尽全力不去感受恶意。而她，却使我丢盔卸甲，将我敏感地灵魂袒露，用尽全力的去拥抱她。我没有办法，愉悦和快乐已经将我的心灵统领，在我理性的城楼上插上胜利的幡旗。"
 },
 {
  "date": "10月1日",
  "title": "",
  "text": "好好，终于放假了，离开了，也让我喘口气。尽管我并不想离开，离开她。但我身边的人的行为实在让人恼火，他们明明知道我的病，却没完没了的隐瞒，我知道，他们希望我的病不会被其他人知道，因为某种无法言喻的羞耻感，他们很善良，也一定会做个好人，但，这样我的病就没有办法被发现，没有被发现就没法被治疗，而问题只有被发现了，才能解决。而他们，却指望着没完没了的隐瞒，让它腐烂，变质。苏格拉底曾说“无知是一切罪恶的源泉”我现在总算明白它的含义了。是啊，没有人天生就想去作恶，去犯罪。而正是因为无知，当人们作恶后人们却没有意识到，有的人在没人的地方窃窃私语，对着别人的行为指指点点，自以为有趣。甚至有时候，朦胧的善良都会因为做事方法的不对而孕育罪恶。"
 },
 {
  "date": "10月4日",
  "title": "",
  "text": "我知道，我知道，你不能喜欢她，你们没有结果的，未来，我甚至不知道我还有没有未来，当我向我的前路望去，荆棘遍野，泥泞满地，我不能将她也拉入其中，去承受不必要的痛苦。还有，我的病，我没法靠近她，她也会讨厌我的，厌恶，唾弃然后用利剑般冰冷的眼神戳穿我的心脏。不，不，我不能再靠近她，一点也不行。"
 },
 {
  "date": "10月6日",
  "title": "越岭",
  "text": "我以为我在山下隧道的尽头看到了你的眼睛，\n你我便已近在咫尺，\n不料那隧道口的牌子上竟标着四个大字：\n禁止通行！\n看来我只有翻过这世俗的山，\n才能与你相聚。"
 },
 {
  "date": "10月9日",
  "title": "",
  "text": "一次，又一次，这叫人怎么拒绝，又怎么忍得住。总之，她回来了，我们的关系似乎又常态化了，在晚自习下课后的走廊，放学时楼道的拐角。我忍不住去等她，忍不住去看她，忍不住等那熬人的下课铃响。我喜欢看到她那望见我时掩饰不住的喜悦，每当看到她的笑容，我的心里便像花儿般绽放，而我心中积聚的忧愁呵，便已烟消云散了。\n每当我看见她，我都恍惚间感觉自己的病好了，与常人无异了，那美好的一刹那，我多么希望我可以将她的笑容拍下，而不是在临睡前一遍又一遍的去回忆，去记忆的河谷中试图重现那美好的珍珠。但可悲的是，当我回忆时，我却什么都回忆不起来了，她的模样，笑容，甚至衣服的颜色裤子的样式都统统的不记得了。我想，或许是因为当我看见她时，我狂热的喜悦和汹涌喷薄的情感将我的大脑全部填满了，于是我再也没有容量，再也没有精力去分析，去记忆。原来，爱一个人就是记不住她的模样啊。但奇怪的是，即使我丝毫回忆不起她的特征，我却能在几十米外，又或是熙熙攘攘的人群中一眼就将她发现。难道说，两个相互喜欢的人之间，真的有某种说不清道不明的联系，或许是更高维度的，又或是我们根本不了解的某种关系，使两个人紧紧的缠绕在一起，难以分离。"
 },
 {
  "date": "10月10日",
  "title": "无题",
  "text": "对，你们是力量，\n是我无法舍弃的希望。\n是你们给我疲惫的身心注入了前进的欲望，\n是你们给迈向虚荣的道路上附上了美丽的光芒。\n你们以取代那层虚伪成为了我努力的全部意义，\n也是你们把那多情的少年引入了激涌的波涛。\n你们是美丽的天使，也是吟唱的海妖。\n我爱你们，但同时也要小心，\n小心你们那无知所带来的，\n排挤灵魂的世刀。"
 },
 {
  "date": "10月11日",
  "title": "",
  "text": "终于，你已经无比近的走进了我的心里，我已经完完全全彻底的被你操控，我的每一次心跳都为你而颤抖，而你的每一个表情，内心的每一声呼唤，都使我的灵魂震颤，我的情感波澜起伏，却又被这冷酷无情的理性重重的压住。\n够了，让我说爱你吧，我怎能让那美丽的云翳上愁云密布，我怎能容忍那无耻的悲痛将你的心儿占据。现在，你已成为我的一切，不要被我那冷酷的表情吓到，你可知这大门的背后藏着一个怎样喜悦的灵魂，我多么希望你能为我儿开心，而不是心生悲痛。\n曾经，我以为只要把内心的感受，无法排解的感受写出来，平静便向我身上袭来。而现在，无论我怎样的写，都无法将我对你无限的情意表达，反而越写越满，像是要从心脏里蹦出来，如果可以，我恨不得现在就跑出来与你相遇，就如同罗密欧与朱丽叶在那深夜的花园里相聚。真的，只有见到你，看到你那美丽的笑容后，我的心大概才能稍稍平静。我爱你啊，爱你，无尽的爱你，让你的笑容伴我入睡，让你我在梦中共数那夜空的繁星吧。"
 },
 {
  "date": "10月12日",
  "title": "",
  "text": "当人们发现生活中毫无希望存在时，人们便倾向于求助于神，又或是某种神秘的存在。\n对于那些算命先生和半仙，无论是我所受到的教育，还是社会环境，都使我的感性对于这种神神叨叨的毫不唯物主义的东西嗤之以鼻。但对于我的父辈和母辈却不一样，反而变成了当所有办法使用尽之后的最后一种办法。于是，我就被母亲拉到了某个很“出名”的神算子家里，试图解决我的病症。尽管我也不知道到底能不能行，但没有经过实验验证就判断真伪的事情我实在做不来，再说假如真的有用，便也了却了我一件心事。\n我的心里总是抱着一种恒久不变的信念，认为科学并不能解决一切，因为我深深的知道人类的局限性，不仅仅的精神的局限性，还有物质的。人作为一个三维感官存在于多维空间的生物，无论如何也没有办法去超越人类本身的局限性，三维，而导致人们对于高维度的空间只能通过大脑的想象，而事实上大脑根本无法去建立一个闻所未闻的事物和空间的模型，于是我们被深深的囚禁于这个世界的时空之中。当然不排除未来我们可以通过某种具有特殊性质的介质来搭建维度与维度之间的桥梁，又或是更加不可想象的东西。但我们必须知道，当下的科学无论怎样的发展，都仅仅是源自我们发现现象后试图能够合理的解释当前所发现的所有现象的一种模型，一种总结而出的规律。但永远不可能是真理，是一切的本质。我们的科学只能无限地接近真理，但并不是真理。\n所以我的理性对于这种奇异的有可能存在的超自然力量保持着一种中立态度，尽管这玄之又玄的学问已经被财迷心窍的人搞得臭不可闻，但总归这也是一种可能性，一种希望，一根救我的稻草。"
 },
 {
  "date": "10月14日",
  "title": "",
  "text": "虚荣，又是可恶的虚荣，将他们蒙在鼓里。可怜的人儿，竟心甘情愿地被虚荣驱使，他们也许根本就分不清吧，到底为了什么而努力。\n可是，你又能分得清吗？虚荣是什么？难道仅仅凡是使别人对你产生崇敬并且使你愉悦的行为都属于虚荣吗？那么，这天底下大概就没有不虚荣的人了，凡是做出了一番成就的人，照你说便全是虚荣之人了。\n或许我还要分的再细一点，至少要让我做事之前明白我在做虚荣之事才行啊。于是我便重新再说，当我做事之前，我的首要目的，我眼中所浮现出的景象，应是我做成了的这件事本身。当我在创作和完成的喜悦，当我演奏出了自己一直以来所喜爱的乐曲，当我在深入的忘我的思考并得出结果所感到的巨大的兴奋，当我骑行在青藏高原上所感受到的令人愉悦的美妙风光，像这样的为了做这件事本身而做，从而从这件事本身之中而感受到的快乐，而不是成功的背后所附带的众人的赞许和崇敬，所有人羡慕的目光。只有在这样行事，这样生活才不能叫为别人而生存，才不能被叫做虚荣。"
 },
 {
  "date": "10月15日",
  "title": "",
  "text": "但我深深的知道，像这样理想的，完全做自己喜欢的事的生活是不存在的，马斯洛早就说了，人必须先满足自己最基本的物质欲望，之后才能去追求精神上的快乐。于是我一直深陷于现实与理想不对等而产生的抑郁之中，直到当我看到了卡尔马克思先生所著的《共产党宣言》，我的心中才又重新燃起了一丝希望。尽管我感兴趣的只有几行字。\n选自共产主义信条草案\n第二个问题：共产主义者的目标是什么？\n答：建立这样的一种社会：使社会的每个成员都能完全自由的发展和发挥他的全部才能和力量，并且不会因此而损害这个社会的基本条件。\n或许这样的文字会显得有些晦涩，但与我一直期望的相对照解释来看，人的天赋和性格会使人在某些领域擅长，并且当人们做这些他擅长的事情时会感到愉悦和快乐，于是我们可以这样来理解。马克思先生希望建立这样一种社会，让所有人的能力都的到发挥，让所有人都能够获得真正的快乐，并且不会因此而损害这个社会的基本条件。\n但这样的时候问题便出现了，假如所有人都去做自己喜欢的事情，那所有人都不可能喜欢的事情谁来做呢？比如数不胜数没意思的机械性劳动，还有一些令人抵触却又必须有人做的工作。难道永远都是共产党员吗？\n对于机械性劳动，马克思先生早早的便得出了解决方法。\n第四个问题：你们将财产公有建立在什么基础上？\n答：第一，建立在通过发展工业、农业、商业和垦殖而产生的大量的生产力和生活资料的基础上，建立在因使用机器、化学辅助手段和其他辅助手段而使生产力和生活资料无限增长的可能性的基础上。\n第二，建立在这样的基础上：每个人的意识或情感中都存在着某种原理，这些原理是颠扑不破的准则，是整个历史发展的结果，是无需加以论证的。\n通过机械，曾经机械只能代替少部分人力，只能进行单一的大量的生产。而现在不同，人工智能的出现使人力劳动被进一步替代了，并且这只是个开始。未来人类的机械性劳动必将被全部代替，人们将不需要再将脑力运用到不必要的场合，人们的大脑将全部用于科学和艺术，每个人都能够获得属于自己的创造欲和求知欲所带来的快乐。\n而第二个问题，罗素先生是这样想的：\n据推测，总有一些职业是人们所不愿意去从事的。但人们可以被这些工资高的、工作时间较短所吸引，而不是被穷困所驱使。于是社会就会有一个强大的经济动力缩小这些特殊职业不合人意的地方。"
 },
 {
  "date": "10月16日",
  "title": "",
  "text": "我曾经听人说共产主义就是想要什么就有什么，按需所取，人的精神道德都高度发达，劳动工作都抢着干。但人毕竟是人啊，人无论怎么进化，道德怎么崇高都不会做的一切都为了他人，无趣的机械性劳动只能被机械代替而不会再某一天人们突然会像一个机械一样不知疲惫的工作还乐此不疲的，毕竟人们要在职业上感到快乐需要使自己的能力得到充分的发挥还有他人的认同感。而假如人从出生就不会为衣食住行而发愁，想吃什么便吃什么，衣服永远穿最好的，房子随便挑，出门有着大数据引导的自动驾驶汽车。那依我看来人们将很快被懒惰统治，并且人们会慢慢的习惯懒惰。但人们需要一种动力，一种让生活变得更好的动力，使人们在懒惰时被并不完美的现状所折磨。所以我认为社会对于衣食住行的限度要掌握好，当孩子们从义务教育中毕业时，社会便分配给他们最基本的生活权力，比如可以进入最基本的小餐厅领取食物，而食物仅仅是面包馒头咸菜一类足够充饥但并不能彻底的满足食欲的东西。衣服是统一的由大机器缝纫的，色彩有限并且不足以上升到艺术品的东西。住所比较小而简陋，出行只能坐公交车。但随着个人对于社会贡献的增加或者成就的增加，生活条件将快速上升，并且让可以让大部分人在十年之内达到顶峰，达到按需所取的要求。当然前期生活条件上升的要快一些，后期则慢些。同时所积累的某种类似货币的东西可以兑换高于此阶层的物质条件等等。\n但与此同时我们到底实现怎样的成就能够提升生活权力这一点还有待商榷，但种类一定要丰富，使人们仅仅通过提升自己的特长，完善自己便可以升高生活权力。\n当然还有很多方式来克服人们的懒惰的本性，或许还有更好的方法也说不定，但对于我来说像这种创造一个马克思所希望创造的共产主义社会模型的思考量实在是过于庞大，我一个人一定是不行的，并且同时还要从当前社会所表现出的蛛丝马迹衍生，实在是困难之极。\n深夜\n还有老人和孩子，肩上的责任。当现在的人们试图去做带不来稳定的经济收益的自己心爱的事时，难免会想到自己肩上沉甸甸的责任，当然还有自己将来可能会得的疾病。而在不远的未来，当儿童由社会培养，老人享受着社会的保障，在加上就医免费，最基本的生存便不再让我们去耗费心思，日思夜想。多么幸福啊，我试图去切身的感受这没有社会压力的存在。仿佛，就如同久久被蒙着双目的人见到了光明，久久被拘束在鱼缸里的鱼儿见到了海洋，我的心被彻底的放开了，再也没有束缚了，变得无比的自由了，于是我便可以去追寻，追寻我生命最深处的那个渴望，用自由的身体去拥抱快乐和理想，于是，我便得到了与曾经那个年代肉体解放所不同的真真正正的，人的解放！"
 },
 {
  "date": "10月17日",
  "title": "",
  "text": "你该加油了啊，我亲爱的姑娘，看到了吗，你有那么多有力的竞争对手，科学、哲学、整个人类和伟大的理想，都在与你争夺我呢！\n而你却仅仅是那一眼，我们暗暗约定好的一眼，在那美好的铃声后的仅仅的一眼，又怎么够呢，让我多看你一会吧。"
 },
 {
  "date": "10月18日",
  "title": "",
  "text": "这可恶的现实！没几天就要期中考试了，而去考试便意味着要去到一个新的环境，但……！我真的不希望再去伤害其他人了，我就像一个恶魔，锋利而又失控的尾巴将所有靠近我的人伤害，骸骨满地，血流成河。而我可怜的心，那过分的同理心，却使我承受着同样的痛苦和更加尖锐地自责。我无比的惧怕到一个新的环境，我真的不想再让别人承受不必要的伤害了，但，我又毫无办法，我必须像一个正常人一样，在该做什么的时候去做什么，去参加所有的，充满着人的仪式和会议。"
 },
 {
  "date": "10月20日",
  "title": "擦肩",
  "text": "用全身的感觉去感受那瞬间的触及，\n这便是我和你仅有的最近距离。"
 },
 {
  "date": "10月21日",
  "title": "",
  "text": "我该怎么办，毫无头绪，盛开的花儿挡住了神的目光。我现在快成两个了，理性坐在了狮子的头上，大概是给他灌了迷魂药吧。\n我突然又掉进黑洞里了。"
 },
 {
  "date": "10月23日",
  "title": "",
  "text": "海洋大学？笑话，我现在能不能上个大学都是一个未知数，竟然还说我会考的不错。这个算命的看来良心还不错，但骗人总归是不对的。虽说他那神神叨叨的样子实在是让我没办法相信他，而且算的我的命运也模模糊糊模棱两可，但他的那一股虔诚的样子却深深的打动了我，毕竟无论是我的理性还是感性都希望他说的是对的，并且无比的希望他那法事做完之后真的就像他所说的那样，一切都结束了，一切都回归正常。\n而当我回到学校后，当我满心憧憬的开始一系列大胆的实验，不断地重复验证后，我才发现，他骗了我。\n光的毁灭\n世界重新陷入了黑暗，\n这白昼曾出现了几个小时，\n所有人都以为世界将进入永恒的光明，\n然而，太阳簌的跌进了海里，\n沉闷的撞击声回荡在每个人的心上。\n人们亲眼看着太阳的消失，\n毫无办法。\n孩子和妇人们痛哭了起来，男人们沉默了。\n眼睛久久地望着那太阳消失的地方。\n麻木的心儿被希望唤醒，\n又被现实的匕首处以凌迟。"
 },
 {
  "date": "10月24日",
  "title": "",
  "text": "我知道，正是几天前我的离开，我的并不成功的自我拯救，让她以为我又一次不辞而别了，直到今天早上，她忧心忡忡的来到我们曾经约定好的地方试图确定我的离去时，她便又看到了我，我看到了，她那美丽的眸子中都是委屈——和愠怒。\n后来，整整一天我都没见到她，我知道，这是一定是她对我不辞而别的惩罚，但又或者，她以为我昨天一整天都不与她相见是因为我讨厌她？不不不，她不能这么想，绝对不能这样想，求求你，不要这样想，我还喜欢着你啊，胜于一切，你怎么能这样猜测呢。我真的是离开了，离开了学校，并不是在学校而不想见你啊，让我解释一下，哪怕一秒钟。但不能……我们的爱情建立在毫无言语的基础上，而对于这种无法交流的爱情，任意的一阵风浪都可能将我们掀入海里。"
 },
 {
  "date": "10月25日",
  "title": "",
  "text": "又一天，没有她的踪影，我不知道你到底得出了怎样可怕的结论，难道认为我在嬉耍这你的感情？从而认为我不可托付。怎么会这样，怎么会这样……假如……但是……我……哎……。\n现实永远都是这样恶劣，我狠命地捶着自己的胸膛，你什么都干不成，真是个废物，彻头彻尾的废物，这个世界上没你才会更好吧！随即，我那不争气的眼泪便流了下来，我安静了下来，头倚在椅子背上，静静的望着夜晚漆黑的天花板，眼泪在我的脸上任意的流淌着，我闭上眼，这几天发生的一例例悲伤和绝望在我的大脑中回放，心儿被狠狠的揪起，颤抖着，直到那救命的疲倦涌上心头，总算将我的大脑塞满，模糊了思考。"
 },
 {
  "date": "10月27日",
  "title": "",
  "text": "哎，哎，可恶的理性，\n你为什么要将我束缚，\n可恶的理性。\n走开！放开我！\n让我去追寻，让我去追寻！\n求你了，放开我吧，\n哎，哎，可恶的理性。"
 },
 {
  "date": "10月30日",
  "title": "",
  "text": "我心如刀绞，面如死灰。"
 },
 {
  "date": "10月31日",
  "title": "",
  "text": "为什么有人当听见自己的双亲去世后，依旧面不改色，而当后来又听到跟随自己已久的仆人也病亡后却不禁捶胸顿足痛哭起来。是因为他对于父母的感情不如朝夕相伴的仆人更深吗？\n蒙田说，当痛苦累计到一定的量时，哪怕一点点微不足道的伤痛都会导致山洪爆发，而这大概就是人们所说的压死骆驼的最后一根稻草。我现在便是了。"
 },
 {
  "date": "11月3日",
  "title": "",
  "text": "躲过了期中考试，我就该回去了，我早就该回去了，但碍于考试。\n我不敢想象我当时写完那句话后情绪的失控，无论如何也不要继续考试的决心。当下午上完最后一节课后，我就要走了，我回到家后我和妈妈大吵了一架，或许吧，只为寻个缘由和契机。我已经计划好了一切，包括我出门后要脱下身上穿的校服的藏匿地点。为的是不引起别人的怀疑和过问。我匆匆的出门后便向学校的反方向疾行，我本计划着打个车回老家待一阵子，但当我自己一个人走在夜幕降临灯光熹微的街上，我却感受到了从未有过的局促感。我的后面一直都有一个人，看不太清，灰衣长袍，面色半蒙，像是在跟着我，但又不可能是。尽管如此我的不习惯休息的大脑还是胡思乱想起来，假如突然有歹徒或者其他什么人将我绑架，将我带到什么隐秘的地方杀害，而现在我的身后又没有家，没有父母，没有任何关心我的人，那么我是不是就会突然的毫无踪迹的消失掉。我清楚的知道这种事情在此时此景绝对不可能发生，但我的心，却随之恐慌起来。\n随着我的胡思乱想，我走着走着就到了东边的一个公园里，里面没几个人，所有的树木和建筑都随着夜色铺上了一层朦朦胧胧的阴影，显得格外冷清，没有灯光，也没有月光。我在公园里漫无目的的逛着，夜晚凛冽的寒风打在我的身上，很冷，我不禁打了个激灵，便赶紧紧了紧外面披的略显单薄的外衣。随着我的前行，突然远远的有个人从黑色的阴影中走出来，渐渐走近，然后擦肩而过，他似乎看到我的模样而感到奇怪，于是多回头看了我几眼，或许是奇怪我这个年纪的孩子这个点不应在外面乱逛，应该在学校又或是家里。我的心里紧张了一阵，等他走过不一会便又放下了。\n远远的前面有一个高台，比附近的所有建筑都高，还建在山顶上。以前我在家里没事向外眺望的时候曾看见过这个高台，那时候的他仿佛是一代伟人君王，站在山顶上以高临下俯视群小，从头到脚无不散发着王者的气息。而现在，却像一个犯了错事被罚站的孩子，孤零零的站在山顶上，被头顶上的浓云压迫着，大气都不敢出。我慢慢的爬上山顶，从高台内部的旋转楼梯登上顶部，凭栏眺望，万家的灯火从近处向天边蔓延，一时间我竟分不清天上和人间。恍惚之间，我看到了灯光下的人们，每个人的心中都有自己的忧愁，每个人都在为自己的生计、事业、学业而殚精竭虑。我看到了他们所忙碌的所重视的东西，现实中的压力和社会的现状使我仿佛从一个理想主义的天边重重的跌到了水泥地面上。你只会空想，你知道什么是对的什么是错的又有什么用？你明白所谓的真理又有什么用？你这样下去什么都做不了，你要前进，无论是向哪个方向，你必须找到一个方向，然后前进，不择手段的前进，如果你希望自己还有点用处的话，如果你还想离你梦想近一点的话，你必须现在就去做，还要做出一番成绩来，不是为了别人，不，是为了别人，也同样也更是为了你自己。\n但现在，我那盲目的信仰已经崩塌，曾经我信仰过金钱，信仰过荣耀，但现在，我需要找其他的东西和方式来鞭策自己，鼓舞自己前进。仅仅的理想是远远不够的，我还需要其他的东西，无论以什么样子呈现的，凡是能让我从我忙碌的，为之而奋斗的事情上得到及时的鼓励，及时的反馈的东西，便是我力量的源泉。\n我需要一个从我自己的心中萌发的方向，而不是别人赋予的，在潜移默化中树立的方向。\n对了，你不是喜欢创造嘛，每当你看到人们将自己心目中的东西，或者不现实的东西由概念变为现实，你的心中不都会涌出极度的兴奋和我也想这样做的迫切感，这会不会就是你的方向？发明家？又或是设计师？"
 },
 {
  "date": "11月4日",
  "title": "",
  "text": "哈哈哈，共产主义科勒尼？梵高可真是个有趣的人，竟想着将所有吃不饱穿不暖的画家聚集在一起，然后将那些卖的好的卖的不好的画所赚到的钱一律平分，以便满足所有人的食物和生活必需品的需要，因为他“认为每个人都应当尽其所能去做他最喜欢的工作，并且得到他所需要的一切作为他工作的报酬。”他和提奥每天忙忙碌碌的准备，考虑着一切细微问题的解决方法，他几乎没有时间去碰画笔，因为“他废寝忘食，总是奔波，奔波，奔波。”\n直到有一天，当他好奇的重新走进他的画室时，心中的一个温和的声音突然问他“你到底是个画家，还是个共产主义组织者”他才突然意识到了自己的使命，而与此同时，这个温和的声音也在叩问我自己，你到底是个发明家还是一个共产主义发明家？\n几天前我一直在被一个突如其来的想法所控制，当我在考虑自己的发明家道路时，一大堆技术和设备的问题在困扰着我，我该学习什么，学习的道路是怎样的，制造的机器有哪些，我买不起该怎么办。而我在无意中在网上看到的一个名词却启发了我——“创客空间”，一个向所有发明家提供可租赁的工具和设备的场所，于是我便满怀憧憬和兴奋的展开了我与梵高类似的心路历程，我激动不已以为这便是我的方向，可当我为一个个具体的细节所困扰时，突如其来的这句话却让我停下了。假如我这样做的话……我还怎么发明创造？这会剥夺我的一切时间，无论是开始还是中间的维护，都将将我的大脑彻底占据，我还要这样做吗？并且，现在中国的社会现状还没有到达它所需要的阶段，人们的生物需求还没有被满足，创造也并没有像发达国家的人们那样看重，创造欲暂时还只是不为生活忧愁的人才能够拥有的玩具，还有舆论环境，也需要等待人民的觉醒，独立思考的能力渐渐上升，这些都是它所需要的外在条件。总之现在还不行，但我想离得也不远了。"
 },
 {
  "date": "11月5日",
  "title": "",
  "text": "他们考完试了，也过完周末了。我又回到了这个令我痛苦又幸福的地方，而她，似乎是有一点点的想见我？又或是完全无意间的相遇？而她那忧愁的神情让我担忧又无比的心痛，“你怎么能让她伤心呢”我的感性在大声的指责我，与此同时我又突如其来感到了一种奇异的放松——“她还喜欢着我”。\n维特啊，你说的没错，爱情这美妙的花朵也会孕育出可鄙的恶之果实，不然，我怎么会看到她难过而新生喜悦呢，人啊，可真是个可恶的奇怪生物。"
 },
 {
  "date": "11月6日",
  "title": "",
  "text": "我的生命，我生命的全部意义，在那一刻，都属于她了。\n你\n生存啊，活着啊，快乐和理想，世俗和梦。\n我的生活因你而精彩，\n你是那极夜的月，\n朦胧的幻影抚慰的我的痛苦，\n你是那驿站的光，是虚无中的信仰。\n总之，你是我一切的一切，我的爱，我的心之所向。\n若要我失去你，\n我定会像那失去绿蒂的维特，失去乌苏拉的梵高，\n独自坠落的渡边，失心落魄的唐璜。\n让我成为一个瞎子吧，\n我将看不到那一步后的惊慌\n和世人的目光，\n看不到那被愚蠢的虚荣所麻木的人心，\n看不到那用轻藐所建造的坚固城墙。\n我将只知道我的内心感受，\n只聆听我的内心所想。\n不再被雄壮的理想烦恼，\n离开人们对我那虚荣的期望。\n那样，\n我就能无所顾忌地去爱，去疯狂，\n去体验那生命的美丽，\n和生而为人的美好。\n唉，无尽的美丽啊，胜似天堂。\n可是我即卑微，又胆小，\n这样美丽的乌托邦只能是个空想。\n唉，唉，远离，现实，去梦中寻找。"
 },
 {
  "date": "11月8日",
  "title": "",
  "text": "危险啊，企图用这不稳定的幸福来冲淡痛苦？\n他就如同在悬崖上跳着快乐的舞，我不敢想象他一旦跳错了舞步，我仿佛已经看到了他躺在悬崖下的那具冰冷的骸骨。"
 },
 {
  "date": "11月10日",
  "title": "",
  "text": "我简直不能再气愤了，他居然污蔑我真爱的小说，污蔑我的歌德，说我看小说纯粹是在浪费时间，有这闲工夫不如去做两个题，背几个单词。他完全不懂！他只是在以偏概全！用他那曾经看过的几本毫无营养的纯粹在浪费生命的文字来类比我的歌德！我的维特！愚蠢啊，看这些伟大的人所写的小说不是来解闷的，是用来发现思想，发现自我的。当你沉浸在一个又一个人物的经历中时，你难道不是也经历了他们的一生了吗，而当你平淡的一生中充斥着这些伟大的人跌宕起伏的生活，感受他们那极致的痛苦和伟大的快乐时，你的人生不就也变得充实，这样难道不能算是另一种生命的延长了吗。我并不聪明，但当我发现作家的笔下的某一个人物与自己如此的相似，并聆听着他们用锐利的思维去剖析这个人物时，这难道不就是在用他们深邃的眸子来认识自己吗。正如当我看到《亲和力》中歌德对于奥蒂莉的认识，“虽说她善于解决困难的问题，但在考试中无用武之地。”还有“认识一件新的知识一定要符合自己所构建的知识体系，一旦出现个新的东西，与之前的事情毫不相关，便木头木脑，一筹莫展”并且得出了这样的结论“他不是作为一个受教育者在学习，而是作为一个愿意教育他人的人在学习；不是作为学生而是作为一个未来的老师。”尽管我对当教师没有什么太大的兴趣，但我看到在平时当我理解了一个知识点去教授别人的时候，就算很难的题，别人也总是理解的又快又准，搞得好多人都喜欢来我这儿问题。这样与现实一结合不就验证了歌德先生的观察和思考。\n可是为什么有些人也看过很多的书，甚至书单中还有一些对我思维方式和生活习惯影响巨大的书籍，但他们的谈吐还是庸俗无比，他们的价值观丝毫没有被影响，没有被改变，他们所崇尚的东西还是权利与金钱，他们还是习惯于攀比，对虚荣卑躬屈膝。我实在想不通为什么我们读了同样的书却对他没有丝毫的影响呢？\n我想，大概是他们还没有长出思考的芽，于是无论怎样的阳光和养料对他们都毫无作用，一个人只有曾经在一个问题上思考过了，当他在小说中看到作者对于此事的论述和辩论才能够理解，才能够被影响，被打动。只有在生活中多思考，多在一些习以为常的事情时加一个问号，多去想为什么这件事会引起人们这样的反应，想为什么他们会认为这样做是对的，当一个怀疑主义者，怀疑一切质疑一切，并且去论证，去思考，只有这样，才能使思考在心中发芽生根，也同样只有这样，人类才能够废除不合理的事情，才能够去发现真理，靠近真理。正如罗素所说“只有大规模的怀疑主义才能够揭开把我们同真理隔开的帷幕。”\n但同时问题便出现了，怀疑主义的要求是怀疑一切，包括一些敏感的话题，如果任何人都可以讨论这样的敏感话题，并从讨论中得出了一个极端的反社会的结论，正如我曾经陷入的虚无主义一样，麻烦便从中产生了。并且，怀疑主义所需要的是一个绝对理性的环境，需要的是科学的分析和大量的论证，而现在的社会中人们在某些情况下并不是理性的，还有一部分人是不善于思考的，于是当某些蓄意煽动者通过诡辩和一些心理学的手段控制了舆论走向和人们的情感，这时候言论自由便是危险的。尽管他们并没有错，只是因为他们缺乏成熟的思考和不全面的分析才使他们成为了危险者。"
 },
 {
  "date": "11月12日",
  "title": "",
  "text": "是的！多棒啊！我们又回归正轨了，只因为我稍稍的靠近了她，在那美丽的晚上，她便感知到了，她的笑容，哎，假如我能够再看的久一点。"
 },
 {
  "date": "11月13日",
  "title": "快乐",
  "text": "快乐啊！快乐啊！\n嘴角上扬，\n你那认真的样子令人神往，\n眼角从书上微微抬起，\n又低，\n你已看到我的目光。\n羞怯在你脸上浮现，\n在我心中激起涟漪万荡，\n悲伤已被抵消，\n欢乐的圣歌降临到了我的身上。\n我的缪斯突然不知道该怎么结尾，\n草草，草草，\n正如那分离时不舍的目光。"
 },
 {
  "date": "11月14日",
  "title": "",
  "text": "爱情，多么奇怪又美妙啊，这种特殊的情感，竟让我想着不求回报的为她做点什么，任何事情，多么特殊啊，这种完全的利他性行为，我不理解但又不得不承认，人并不是绝对的自私的，人还有爱。尽管我曾无比的讨厌那些高高在上的大人们所为了哄骗孩子而编出的无比幼稚的骗局、童话和伊甸园。用自己的想法来控制孩子美其名曰“保护”，从而使我在渐渐的长大中，一次次看到了这个社会的现实，人性中的恶后，便开始不再相信一切含情脉脉的美好，强烈的反作用力使我一厢情愿的认为一切美好都是虚构的假象，并且以为利益关系便是一切，还想用利益来解释人与人之间的一切关系。但当我爱上她之后才发现，原来真的存在一种奇怪的关系，使人巴不得将自己的一切都奉献给她的这种违反自己利益的行为，但它就在那，多么奇怪啊，多么不理智啊。\n但我爱别人难道就真的没有索求了吗？我难道不是希望看到她那脸上浮现的笑容，让快乐的花从她的心中绽开，从而使我自己快乐吗。是的，正如这美好的……同理心？又或者是同情心？不管叫什么总之使我的追求快乐的欲望附庸在了她的欲望的身上，于是人们的彼此相间隔的欲望从此相通了，人们不再只是为了满足自己的欲望而努力，从而为了他人，为了社会，为了能从别人的脸上获取快乐而产生自己的快乐。这种人与人之间的同理心，便是人类社会存在的根基。"
 },
 {
  "date": "11月17日",
  "title": "",
  "text": "是的，是“同情”，亲爱的加缪，没错，正是同情才使我们能够走向安宁。同情，但并不单单是对弱者的同情，而是是对普罗大众的同情，理解他们的行为，知道他们所做的一切行为的根源，明白他只是个接受外内界刺激并做出反应的人而已，于是，无论他做了什么事情，都能够去选择宽恕，像神明一样宽恕一切，理解他们的一切想法，一切行为，明白它曾是个孩子，也终究是个孩子。于是当我们每个人都能够去理解别人时，我们便不会被人们的幼稚行为所激怒，我们便不再仇恨，不再凶杀，不再作恶。这大概就是人类的神性，尽管有的人多有的人少。\n于是，我便理解加缪所痛恨之极的死刑，尽管可能和他的依据和推理过程不太一样，但结果是完全相同的。我曾见过人的恶，也知晓一个人可以做怎样的下作罪恶的事情，并且清楚这个世界上无论如何演变和前进也终究会有罪恶存在。但同时我也知道一个人的局限性，人终究是人，当生活的巨浪将一个人打翻时，他只能尽可能地去改变现状，拼命地胡乱抓身边的东西，无论是来救他的救生员还是曾将他毁灭的浪花，这时候他的理智已经不起作用了，已经跟一个疯子没有什么两样了。而这时候当我们对一个杀人者宣判死刑时，依据则是他的行为，而他的行为方式，遇到问题的处理方式却与他的家庭，他的父母，他所受到的教育和整个社会氛围息息相关。假如他足够聪明，足够理性，足够成熟……但他没有，这是他先天具备的。而道德底线和解决问题的方式则是我们可以给予的，当他们还没有杀人时，激烈的仇恨在他的脑中酝酿，直到仇恨的情绪转变成了杀人的行为，而这段时间我们是可以干预的，假如这个社会可以在仇恨转化为行为这段时间能够给以干预，便不会有杀人事件，也不会有人被杀。而现在，我们所做的行为的不足却怪罪到一个人，一个当时被恶魔所控制的人身上，这显然是不合理的。\n当然我并没有希望取缔所有监狱和刑罚，也没有这个想法。社会不可能照顾到所有人，总会有人的欲望没有释放的途径，也总会有人被恶魔控制而行恶。但我只是认为该给他们一个机会，而不是宣判死刑。我们应当在将他们逮捕后重新给予他们曾缺失的道德底线和解决问题的方法，给予他们教育，直到他们被感化，认识到自己要做什么事情，自己的特长，自己获取快乐的方式。我曾听说有人不认为应当拿自己所交的税去养活这些罪犯。但我却认为，一个罪犯的诞生并不是突然出现的，而是因为我们，因为这个社会的无视，因为我们的照管不周，因为这个社会没有正视所有人的欲望，没有给予所有欲望以不会影响到其他人的合理的释放途径，使一个曾经的孩子走上了犯罪的道路。而这些钱，则是我们应该给予的我们行为过失的补偿。\n但假如从根源上溯起，罪恶的产生是因为无处释放的需求，我们知道，人的内心深处是存在毁灭欲的，也会有很多奇奇怪怪的别人无法理解的嗜好，因为人毕竟是人，所以我们不可能也无法凭空的打消他的需求，除非杀死他。所以假如要使这个社会的罪犯越来越少，那么就应当使被压迫的需求越来越少，正视这些需求，并且为其寻找合理的释放方式。我向来都认为当一件事情不会影响到他人和社会，并且能够给你带来足够的快乐时，这件事便是合理的，是不容他人侵犯的。所以假如我们通过现代科技，通过虚拟现实，或者说未来的更加真实的交互系统来让人们无法排解的需求得到合理的满足或引导，这时候这世界上便不会再有罪犯存在。"
 },
 {
  "date": "11月18日",
  "title": "",
  "text": "有时候，我在思考中突然回过神来，我看到的一切就都变成新的了，我像是从某个遥远的时代刚归来，一切都需要重建，是的，我是个人，我在行走，我拥有着很多东西，让我想想，生命，家庭，美丽的爱情，还有……我的心突然沉了下来，又回到了这个艰难的境地——我的病。"
 },
 {
  "date": "11月19日",
  "title": "",
  "text": "“要不然，要不然，离开吧，改变这一切 ？”\n“不，改变太危险了，保持这样吧，改变后你可就与别人不同了，你会孤独的。”\n“孤独又怎样？难道就因为惧怕孤独就甘愿承受这无尽的痛苦吗？”\n“不，孤独是永恒的，而痛苦则是暂时的。”\n“暂时的？难道你看得见光吗？”\n“我看不见，但是，我相信，太阳总会升起的，到那时，光会融化掉这漫长寒冬的每一丝寒冷，鸟儿会再次唱响那动人的歌喉，会看到的，总会看到的，只要你等，一直等……”\n“呵，乐观的人儿，我多么希望能与你一同看到那美丽的景象，一同看那似火的朝阳，看那能量的源头登上众神的王座。但我在黑夜中呆的太久了，视力消减了，衰退了，即将成为一个瞎子了。到那时，就算有光，也照不亮我那黑暗的牢笼了。”"
 },
 {
  "date": "11月20日",
  "title": "",
  "text": "奶奶去世了，在今天。\n我从未经历过这样的事情，这是我生命中第一个人的死亡，我知道，以后随着时间的推进越来越多的人从我的生命中死去，直到我自己。\n我以前曾假设过家里人去世，也在脑海里推演过每一个我身边的人的死亡，也许是我已经与死神走的太近了，使我当听到这样的消息时我并没有悲痛欲绝，但别人并不知道我的过去，而我也不希望特立独行的表现出无所谓的姿态。于是我在回去的车上不断地思考我应该在葬礼上做什么样的姿态，表情应该怎样，言辞，并试图尽可能地做出庄重和悲伤。但我这可恶的逆反心，我内心深处某个逆反的开关却不允许我这样做，他试图在挑衅我，也试图在挑衅一切。我笑出了声，但还好没人看到。\n农村乡村的葬礼显然并没有我想象中的庄重，刺耳的哀鸣仿佛是地狱中众鬼的啼哭，还有一系列神秘的仪式，我并不相信生死轮回，也不相信底下的世界，这些不过是人为了掩饰自己对于虚无的恐惧而创建的想象之物，死了就是死了，为什么还告诉自己在所谓的另一个世界上还活着，这也许就是生之人对自己可怜的慰藉吧。\n在下葬时有一个我并不认识的人问我为什么没有流泪，我想他大概是在质问我为什么不爱我的奶奶，为什么不伤心。我反而更想问他，当一个人在其生时你没有给予其快乐和幸福，而在他死后去大肆悲痛仿佛心如刀割，这种虚假的仪式感又有什么意义？\n最后，与其这样混乱嘈杂的仪式，我更希望当我死后能够将骨灰盒送向太空，会场上只有爱我的几个人，每个人都笑着。"
 },
 {
  "date": "11月21日",
  "title": "",
  "text": "当我知道奶奶是在凌晨的睡梦中去世时，我似乎感到了一丝宽慰，这不正是我所崇敬的死亡方式吗，毫无痛苦，不知不觉，将生慢慢的融进了死中。奶奶一生都是个好人，不论是家里还是乡里乡亲都一致认为她是一个难得的善人，一生好事做尽，永远在考虑着别人，每年过年的时候都在无比虔诚地祈祷来年风调雨顺，家人和睦，一生平安。尽管她并不聪明，甚至愚昧，愚昧到会将别人所做的不好的事竟理解成了为她找想，她的眼中没有恶人，当然除了那个年代所有人所仇恶的鬼子，但已经过去了。她眼中的世界满是善意，于是她便生活在一个充满善意的世界中，她是幸福的，她的心中充满了神性。以至于假如这个世界上有人鬼神之属的话，她也一定会成为一位神祗，一位保佑着我的神祗。"
 },
 {
  "date": "11月22日",
  "title": "",
  "text": "或许，这个世界上真的存在神也说不定？但不是像神话中的那种上天入地无所不能，而是的的确确存在的宇宙中的高等文明，某种一直在默默的观察着地球的生物，我记得费米悖论中认为，假如外星人早已来到过地球，那么为什么地球人到现在都没有发现它呢。我突然想，那假如他们不想让你发现他们呢？假如我们把宇宙中早已具有外星文明并且科技也无比发达作为前提，那么按外星高等文明的发展水平，他们想制造一个没有他们的楚门的世界难道不是很轻松吗，假如外星生命早已完成了宇宙大航海，已经清楚了各自的国界，又或者已经统一，然后当他们发现地球这个新鲜的低等文明，发展速度极快而又充满着活力，他们的高层决策部门难道不会签订一个类似不干涉条约，决定不去干涉地球的科技与文化，任凭其发展，直到到达某一个标准，科技发展水平又或是整体思想水平这类的标准才正式以友好邻邦的身份出现。虽然感觉有点阴谋论的味道，但这种可能性还是有的，并且某种程度上解释了费米悖论。\n但在我们的大多数想象中，外星生命往往是敌对的，有侵略意图的。宇宙也像三体小说中描述的那样，每个文明都是带枪的猎人。但事实上人们总是会把某些残酷的猜想当作真理，而其实只是因为紧张（恐惧）与崇敬的心理状态无比的相似，然后人们就把它们搞混了。于是无论是我的叛逆心理还是我的理性都认为应该还有一种更加合理的解释，与这种残酷假设不同的解释。于是我想到了一个东西——道德。\n文明的发展就像在一个越来越锋利的刀刃上行走，而道德则是保护我们不摔入灭亡的靴子。因为我们看到科技正一点一点的向更加的危险靠近，而当人类文明到达一定地步时，任意的一个科技在不当的使用下都会对文明带来灭顶之灾，于是整个文明都将置于一个危险的剑刃之上，并且我们可以看到，地球上的高科技在历史上并不总是掌握在理性之人的手中，而人性中也同时存在着善恶两把利剑，假如一旦失衡，文明便会覆灭。\n所以，当我们外部的武力越来越强大时，我们也需要一颗强大的内核来与之抗衡，否则我们就会被其控制。这个内核便是道德。一个文明只有同时具备强大的科技和更加强大的精神力量才能对抗一次又一次的外部的战争和内部的骚乱，才能在这个拥挤的宇宙中与其他的外星文明和谐共处，才能在茫茫的宇宙中找到属于自己的一个位置。"
 },
 {
  "date": "11月24日",
  "title": "",
  "text": "既然神存在的话那鬼又是什么呢？高维生物？当我看了电影《千星之城》中对于高维的描述后我才又一次重新思考这个问题，就像它们星球中那个高维集市一样，虽然的的确确的存在但却又无法影响现实，只有带上那个升维的眼镜才能看得见。虽然实际上维度似乎并不是这个含义而这个却有点平行空间？的意思，我也搞不大清楚。但假如真的存在鬼就好了，有鬼的话就有灵魂，有灵魂我也就不会死了。"
 },
 {
  "date": "11月25日",
  "title": "",
  "text": "我死了的意思是真的我死了还是这个世界死了？是我被世界抛离还是世界本身消失？假如我死后这个世界是否存在？世界是否会随着我一同消失？\n自我\n我能感受到自己的存在，\n自己的意识。\n可是，我又怎么知道别人也是否如此，\n既然永远无法获知，\n那么便永远是谜题，\n引人怀疑。"
 },
 {
  "date": "11月27日",
  "title": "神明",
  "text": "无上的主啊，你问我渴望什么，\n我渴望意义，永恒的生命。\n但美丽的东西总是稍纵即逝，\n永恒的东西往往会失去它的价值，\n也往往被人忽视。\n也许，真的，\n一切都是最好的安排，\n你用你那至高的智慧创造了这一切，\n一切命运，发展，消亡，\n都在上面留下了你的笔迹，\n清晰可见，把一切指引。\n我不再去抗争命运，\n因为连抗争这一行为，\n也渗透着你的意志。\n你用你那零星的智慧给我启迪，\n把我鞭策，旁敲侧击，\n引入你所希望我进入的那条伟大航迹。\n我不知道你在哪里，\n在我身上？还是一个全新的个体，\n你能改变我的想法？\n还是只能左右别人的意志。\n我甚至都怀疑，\n也许我是唯一，\n其他都是你所幻化的外形。\n呵，荒诞至极，误入歧境。\n我在你那蔽天的巨手下，没有任何权利。\n只能感受这一切，所有的经历。\n你啊，你啊，实在太过顽皮，\n把我戏弄于股掌，\n玩弄我的感情。\n分分，合合，阴晴，圆缺，\n不都是你的所为？\n够了，够了，我渴望平静，\n而你，\n却偏让我波涛汹涌，起伏不停。\n开心？愉悦？\n在你看来皆是儿戏。\n而我呢？\n却被你这儿童般的胡闹搞得心神不宁。\n哎，玩弄吧，玩弄吧，请随心所欲。\n我不过是这浮沉世界的一粒草芥，\n转瞬而逝，不足挂齿。\n神啊，\n你怎么选择了我这个干瘪地容器，\n流出的文字毫无美丽的语言和文学价值，\n只有火热的感情和冷酷的理性。"
 },
 {
  "date": "11月30日",
  "title": "",
  "text": "我的感性就是个发了疯的国王，坐在我所驾驶的破马车上对我指指点点，发号施令。而理性，则是眼前这匹瘦骨嶙峋的老马，尽全力的躲避着那疯子愚蠢的命令所带来的陡峭的悬崖和湍急的河流，一个劲的追求稳妥和安全。\n你问我是什么？我就是被这个疯子和老马所控制的没有灵魂的驾车夫，摇晃着木头似的脑瓜等待着他们的差遣。"
 },
 {
  "date": "12月1日",
  "title": "",
  "text": "美丽的十二月啊，充满着阳光，\n让我这个半瞎的人可以看到光芒。\n（哼，愚蠢，补）\n同样的十二月啊，乌云密布，浓雾天降，\n你又回到了那个永夜的炼狱里了！\n（哈，再补）\n同样的十二月啊，\n光依旧在天空照耀，\n这可怕的心的颤抖，\n原来只是你所开的一个小小的玩笑。"
 },
 {
  "date": "12月2日",
  "title": "",
  "text": "十二月，又是这样的一个十二月。一年前的今天，疾病突然来临，将我击翻在地，而我的信仰，无比坚定的信仰使我继续前进，给予我无比强大的动力。而现在，信仰已逝，我能靠的只有走投无路的处境给予我压力，使我尽可能地负重前行。"
 },
 {
  "date": "12月3日",
  "title": "",
  "text": "听着，你必须要走出去了，走出这一步，你们两个必须有一个更加坚实的联系。一个独立于学校，缘分的更加坚固的联系，你该去找她了，要到她的联系方式，只有这样你们两个才不会被误解和离别而分开，只有这样你们才能在那个危险而又重大的决定后有未来啊。你必须将你们的联系更近一步了，否则等待你们的，只有痛苦的离别。"
 },
 {
  "date": "12月5日",
  "title": "",
  "text": "我就快要走出去了！她就在那！硬币啊，你那令人意外的正面不就是让我在今天见到她后接着勇敢的建立联系吗，可是！一切都有了，你却偷走了我的勇气！怯弱啊！怯弱啊！将我击沉吧！\n可是当我现在在脑中排练着与她搭讪后接下来的事情时，我却迷茫了，只有几分钟，短短的几分钟什么也说不清楚啊，告诉她我就要离开了？还是什么？不行，不行，我必须要详细的计划一番才是，鲁莽的做事是会搞砸一切的。"
 },
 {
  "date": "12月6日",
  "title": "",
  "text": "我一边又一遍回想着昨天的失误，当我试着去走向她时，她却极其自然的避开了，而在她的瞳孔中，我不仅发现了吃惊，还有恐慌和不安。我不该这么草率的。可是突然一股熟悉的感觉袭上心头，难道，她曾经的那次令人吃惊的向我靠近也是因为如此，想早早的与我建立联系，而我，却不争气的逃走了。多么难过啊，她那时大概也是这样的伤心吧，我怎么……哎……我，对不起，对不起了。假如我能够与你建立联系，我一定不会再让你难过的，一次都不行！"
 },
 {
  "date": "12月7日",
  "title": "",
  "text": "我真的爱她吗？难道不仅仅就是因为美感？就如同看到一幅美丽的油画想将它据为己有，难道真的仅仅是如此吗？看来，唉，国王啊，你可真是太浅薄了，你难道除了感受其他一点都不会了吗？哪怕是一丁点的思考，你就会知道，爱不应该这样草率啊。\n可是，难不成你还能从这仅仅的一面里看出点什么吗。\n我想，是的，但我不确定，我从她的言行、举止和行为方式中，都感受到了一种奇妙的气质，她有时行事端庄像一个孤傲的女王，有时候却又嘎嘎嘎的像一只快乐的小鸭，还有……她没什么心计，热爱自然和美的事物，没有过度的自信心，是那种我特别讨厌的一种卖弄聪明，巧舌如簧的的自信心，是对于自己所认定的某种理论有着不可置喙的优越感，并且善于论辩和引战的自信心。还有一种，她具有一种像是数千年来中国女性所具有的一种特殊品质，我仅仅只能感受到但却无法将她主动描绘出来的，像是女德但她又并没有被压迫和束缚，说是自由但她心里又有着某种潜在的约束力，但总之使她变得像是一个母亲模样的一种温柔。\n看吧，果然是情人眼里出西施，无论怎样的女孩我估计他都能分析出一大堆优点出来吧。"
 },
 {
  "date": "12月9日",
  "title": "",
  "text": "又是一个没滋没味的周末，缺少了阳光的照射，一切都隐在了黑暗之中。\n人的主观意识可真是神奇，本是因为她在周末总是看不到我，因为我的病导致我在周末总是请假去看病，于是她便不来找我，结果呢，竟让我以为是她自己请假回家了。\n不过从中我也可以看出，我是极其被动的，她总是在打破自己的习惯，为了我，为了我们之间的联系。而我自己，却总是试图掩盖爱她这个事实，让我自己不去行特殊之事，哼！这可恶的老马，这可恶的理性。"
 },
 {
  "date": "12月11日",
  "title": "",
  "text": "致不知名的你，\n这已是我为你写的第二封信，第一封就在刚刚被我撕掉了，什么都没有说清，通篇都是狂热的感情，真是愚蠢至极。那么，现在我要开始认真了，拿出我的看家本领来，给你把这封信写好一点。\n如果这一切都没有好转，下学期你大概又要见不到我了，对啊，我又要消失了，就像那暑假之前一样，又要让你难过了，不过，看啊，我们这不已经有了更加牢固的联系了吗？假如我真的在几天后勇敢的走出这一步的话。我将会知道你的电话，你的住处，你的生日，你的可爱的小性子，还有你的一切一切，都将成为我们之间条条丝线般的联系，我们的两个毫无交集的世界将融成一个，这样，你就再也不用怕我消失了，你可以找到我，假如我真的离开了，我会在学校对面的小房子里，写着我的书，我们那时候相距也不过百米，我们还联系着，在某个维度里，我们的红绳还在那悠悠的荡着，连接着两颗跳动的心脏。\n可是，我不知道这绳儿是否坚强，能否抵过时间的冲刷和空间的间隔，能否跨国这深邃的鸿沟，能否软化这刺猬锋利的甲胄。不知道的东西太多了，但我知道，就在我斜下方的某个位置上，你就在那，托着腮，思念着我（这纯粹是我自大的幻想，是不是真的我可无从知晓。）\n看吧，我又不自主的押上了韵脚，而且，又开始长篇大论，滔滔不绝，要是我后面的文字再这样，就把这一封也一并撕掉。\n那么，你还想知道点什么？小说？噢，我将要写的小说中可能会提及你，至于有多少，是好言还是贬语，我才不告诉你，等到出版我就会买一本送给你。至于我离开的原因，哎啊，这个也许有点难过，对于我来说。不过押着轻快的韵脚，读起来也不会难过多少。难以言喻啊，假如你一定要知道，大略就是：我就像一个小球，带着五彩斑斓的斥力，把我与这众人的生活拉离，没什么大不了的，在未来的某一天我想就会恢复正常，但现在，就像把泡沫板压在水里，浮浮沉沉，一心向外逃离。\n在我理想的计划中，我还会练习钢琴，油画，也许还要搞个大事情，不过一切都未开始，我也不能再夸夸其谈，以防什么都没有做成，还把洋相出尽。好了，我要赶紧结束这以自我为中心的言语，否则我一定会将它撕掉的。假如，这可怜的纸片最终完整的到了你的手里，你一定要好好的珍惜它，要知道，它曾经历过怎样可怕的劫难啊！\n我写着写着就忘了时间，刚刚响的那是下课铃吗？什么？他说还有两分钟就要上课？完蛋了，我要赶紧出去了，去见你！否则你一定又要在心里埋怨我了。\n哈！他骗我哩，我抱着一丝希望冲出去，没想到竟然与你正面相遇，多么有趣啊，上一秒还在为你写信，下一秒就遇见了你。\n最后，用你那美丽的眼睛注视我吧，我一定会说出那难以启齿的话的，在一切还足够清晰，我还没有陷入这迷途之前。"
 },
 {
  "date": "12月13日",
  "title": "",
  "text": "我这是怎么了，当那一刻我身旁的人都没有表现出厌恶，当我的顽疾隐隐约约的仿佛消失时，我却突然并不想改变了，是因为惯性吗，还是因为看到了文森特那苦难的一生，你想成为他吗？\n所以，你到底在渴求什么？你已经习惯苦难了吗？渴求的来临却因为打扰自己的孤独而心生反感？不！苦难是有益的，天将降大任于斯人也，世界上的所有伟大的人，都曾经历过常人无法忍受的苦难。\n所以，你这是在用苦难来换取未来的幸福啊，又或许，你所经历的苦难时间越长，越痛苦，你将来的幸福便会更加的长久和稳定不是吗。"
 },
 {
  "date": "12月14日",
  "title": "",
  "text": "梦中的我啊，不要再把我这所剩无几的快乐与神交换了，一切都没有意义，只有快乐才足够真实啊。\n身后的伟大还是当下的快乐？\n而我的神祗，你大概对我很失望吧，但我请求你，成全我吧！我不知道会怎样（我不在乎），我也不敢去想，现在，只有现在才是真的。\n可是，明明再过几个月，一百六十几天，你就要与她彻底的分离了啊，那可悲的结果，那时候，我们就完了啊，我还要努力的去拥有她吗？\n是的，是的，要拥有啊！难道人会因为一切都会死亡，消失而放弃去寻找幸福，拥抱爱情吗？不能！活在当下吧，去拥抱所爱的一切吧，不去拥抱的话，我们岂不把唯一可以拥有的一点幸福都丢弃了吗？"
 },
 {
  "date": "12月16日",
  "title": "",
  "text": "明天……明天！她会来我的身边？！如果说这次段考全年级相邻的两个班级会小范围的打乱顺序，而与她相邻的班级却正在她的头顶、我的隔壁，所以，所以，她会来我的身边考试！对吗硬币，你这一次又一次的正面不就是代表着她会来到我的旁边，我……我不敢想象这到底是怎样的联系，还是神的旨意？看来，这次考试我必须呆在这了，因为这样就可以一整天都见到她，多美好啊，就算痛苦……痛苦，不还有她吗。"
 },
 {
  "date": "12月17日",
  "title": "",
  "text": "看到她那兴奋样，难道你不开心吗，她开心是因为你啊，而只因她把快乐放在了朋友身上，你就感受不到了吗，为什么脸上却不给她一点欢快的笑容。只因为在考场里你难过的要死，局促与不安的情感将你淹没，你就这样恶毒的把你身上的毒传染给了她，让她又变的难过而怀疑，怀疑你是否真的喜欢她。\n“既然喜欢我为什么我们靠的如此的近之时你却又面露悲情。”\n看她那临走前绝情的眼神，从考场匆匆跑出来本想着快快走开再也不见到你，却不料与你相遇，满眼净是嗔怒，质问你的感情。\n而我呢，竟装作毫不知情的模样，对视完便把眼镜一摘就不理她了。可恶的老马啊，你怎么净做这样的糊涂事呢，你难道就这样抗拒特殊，抗拒未知，为了装作不认识她怎么就这么绝情呢，你难道不知道她正处于怎样的心情吗，可恶啊，对不起，对不起啊，假如可以的话，请原谅我的过错，就如同你原谅深空中的那一颗星星一样，原谅我吧。"
 },
 {
  "date": "12月18日",
  "title": "",
  "text": "今天中午下楼回家时，我无意中在楼道的人群中发现了她，她像是在等我，而我的老马却准备再一次逃离。我在人群中胡乱看向其他地方，试图不让自己的眼睛沉沦于她，因为我知道我一旦望向她便一定会直勾勾地锁定于她的眼睛，这样我便无法脱身了，但当我放松下来从楼梯拐角准备看看她到底要做什么时，我却又睹到了她的眼睛，寒冷，决绝，痛苦。我停下了，拥挤的人流从我身边穿过，我却毫不知情，我只是盯着她，我不知道在她眼里到底看到了怎样的我，我只知道我与她一样痛苦，悲伤。然后她走开了，扭头，转身，干净利索，毫不迟疑。"
 },
 {
  "date": "12月19日",
  "title": "",
  "text": "我可真是太无能了，永远也不能自己走出去，去找她。主动点啊，我这可恶的理性，你在担心什么啊，现在，好了，你什么都没有了，那唯一的光，因为你从未做出过爱她的表示。“对于一个从未爱过你的人，你付出的太多了”她想，不断地怀疑，却又被我怯弱的行为予以肯定，“一定是这样的”。\n不是啊，不要去怀疑啊，你的内心难道会欺骗你吗，即使从未有过明确的表示，那一次又一次心的震颤可都是真的啊，从我看到你的第一眼起，我就从未放弃过爱你这一想法啊，即使你那次对我流露出的不满和愤怒，我也都从中感受出了爱啊，我所读到的都是“你让我等的太久了”而表现出的对我的嗔怒。心是神圣的，感受到的有时会与现实不同，甚至截然相反啊，不要用现实去检验爱情，用心去感受吧，难道爱情是物质的，是虚荣的吗？不是的，爱情是艺术，是心与心之间的联系。\n理性的老马啊，让我被爱情的荆棘刺伤吧，你一次又一次的躲避，我的快乐已经被你那胆小的内心夺去了，安全，但是痛苦啊，可恶的世俗啊，你们永远都在追求稳定，你们难道不知道，人永远得不到满足，得到稳定之后，人们又会渴求逃离。任何感性的行为都会被你们恨之入骨，大力唾弃，然后拿出你们引以为傲的理性，告诉我什么是对的，什么又是错的。\n什么对错啊，都是乱语，你们只知道稳定，却不知道，只有改变才能前进，波涛汹涌，狂风呼啸才能使风帆扬起。而稳定，风和日丽，只会使人沉湎，麻木，死在梦里啊。然而，我的心中突然冒出一个声音，安稳不就是幸福？人们所一生期盼的东西。而不断地改变文明才能够前进。矛盾啊，矛盾，个人与集体，只能寻求平衡，却不能将其一舍去。\n晚\n心中的痛苦使他跑了起来，越来越快。昨天下了场雨，操场上满是冰。不出所料，他狼狈的在冰上滑倒了，整个身体扑倒在了地上，脸重重的砸向冻实了的塑胶跑道。他看了看周围，还好一个人都没有，泪水从他受伤的眼角流了出来，滴落在冰面上，冰融化了。"
 },
 {
  "date": "12月20日",
  "title": "",
  "text": "硬币啊，我恨透你了，当我向你问我们是不是已经结束了的时候，你为什么一次又一次的翻出肯定的正面呢？可是，明明她还没有做出任何表示啊，只是，只是，我已经两天没有见到她的影子，希望还在啊，可你，却连她是否还爱我都一并否定了，太绝情，太彻底了。\n我的潜意识曾冒出一个可怕的想法，也许只有这样的戛然而止的悲剧才足够美丽，但我已经恶狠狠的打消了这个可怕的想法了啊。怎么，命运，你就这样的追求美？甚至不惜狠狠的伤透我的心？来的太快了，太早了，我没有一丝准备，虽然那快乐的喜鹊已经销声匿迹。"
 },
 {
  "date": "12月21日",
  "title": "",
  "text": "假如告诉你这余下的一生将毫无快乐，只有痛苦，无尽的痛苦，那还活着干什么呢？而我在网上看到的那些可怜人们，那些与我患了类似病症的人们，他们有的已经到了中年，却依旧被病痛折磨，他们没有办法工作，努力，恋爱，他们已经将这些当作了奢求，只是希望着能够离人们远一些，不去经受人们言语的攻击，而做着最卑微的工作来保持自己活着。他们还有的在念书，父母不理解她，还痛骂她不努力学习，辜负了他们的希望，说她无耻，令人恶心，用断绝关系来与之威胁，期望她回到原来那样。有的在规划死亡，做着生命的倒计时。有的渴求上天，希望上天能原谅他的罪过。他们的每一种样子，都有可能在我身上发生，或者说他们便是我未来的样子。\n我突然理解了维特为自杀这一行为的正名。难道一个人维护自己尊严的行为能叫做软弱？一个永远被歧视，永远被唾弃的人，突然有一天鼓足了勇气去保护自己的尊严不再被侵犯，不再被恶劣的人性践踏而选择的自缢，难道你们就要称之为软弱？是的，我可以去回击他们，但假如他们是山，是海，是笼罩在头顶上的乌云，是我的整个世界时，难道我的微不足道的回击不又是为他们提供了可耻的笑料？他们践踏的新的缘由？\n他们还用责任来搪塞我，说自杀是对于亲近之人的不负责任，但假如她爱我，她是不舍得让我受苦的，也是不舍得让我永远都沉浸在痛苦之中的，而假如只有利益关系的虚伪的家庭，我想他才会痛斥我的逃避，痛斥我的求饶，因为这会损害到他们长期以来的投资，他们务必重视的利益。\n人们总说逃避是软弱的，是懦夫才能做出的勾当，但人存在于世每天忙忙碌碌的难道不是为了逃避死亡，逃避直面虚无的恐惧？让自己沉浸在纷纷扰扰的世界里，每天睡觉前琢磨着如何更好的满足自己的欲望，尽管总会消失。假如一个人足够理性，足够明智，它便会知道自己能够对抗的是哪些，该去逃避的又是那些，而不是像个被喂满了励志鸡汤的莽夫，不做选择的一律对抗，往往这样的人的下场只有伤痕累累，被坚壁磨没了意志。\n晚\n刚刚我做了个梦，梦到我用我锋利的手指甲划开了我手腕上的大动脉，红色的血液喷涌而出，将我的所有衣物、床单和整个身体浸染。也许大多数人会认为在自杀的一瞬间是恐惧的，事实上在划开的那一瞬间我的大脑里什么都没有，只是感到很放松，一种临解脱前的舒适，自由。我太累了，太累了，死了不就放松了吗，不就什么都与我无关了吗，也没有那煎熬而又痛苦的明天，多幸福啊……突然间，我的心中一紧，某种似乎是设定好的防御机制使我又意识到了自身独一无二的存在，我死去，消失，虚无，世界消失，不存在，不能，不能，我猛烈的摇头，浑身急剧地颤抖，然后我就惊醒了。当我醒来后突然发现我正侧着身子，我的手指甲就靠在动脉的旁边，我惊恐万分，急忙拿离，随后便打开了台灯，坐到了案前来。"
 },
 {
  "date": "12月22日",
  "title": "",
  "text": "好了，好了，她多么可爱啊，正为上节课从我身边跑过却没有发现我而懊恼呢，多快乐啊，像只美丽的小麻雀，正叽叽喳喳的在窗边与朋友打闹呢。假如，假如靡非斯特在我身边的话，我一定要大喊一声“请你暂停！”然后就算让我立即死去我也乐意呦。\n不过，看她之前那认真的样，大概是要求证我的感情吧，假如我刚刚不在或者错过的话，我想我们一定就完蛋了，看来，神啊，你还不想让这场戏剧结束吧。"
 },
 {
  "date": "12月23日",
  "title": "",
  "text": "这个圣诞节吧，维特，就这个圣诞节吧。"
 },
 {
  "date": "12月24日",
  "title": "",
  "text": "维特死在了明天的圣诞节里，而歌德，却在这天获得了新生！我的爱，在这个平安夜里，祝福你，发自我的灵魂，尽管我并不是个基督教徒，但我还是忍不住为你祈祷，愿主保佑你，阿门。"
 },
 {
  "date": "12月25日",
  "title": "",
  "text": "勇气啊，机会啊，给我个机会吧！你怎能不守信义啊，一整个白天，你可是神啊！你放心，我一定会抓住的，一定会，就在今晚。求求你了，我的神祗，这将是我今天的最后一次机会了，我的心里已经充满了绝望的泪滴，所以，所以，用你那无上的美感来创造一次 最美的相遇吧，让我们互诉衷情！让我们！……\n机会！机会！上天啊，帮帮我吧，不要让光的毁灭再次上演。\n放学后\n怪我！可恨的怯弱！我明明都走出去了。神啊 ，我不在责怪你了，你没有错，你答应了我的诉求，给了我这无比可贵的机会。可我呢！却亲手把它放弃了。我下楼时，她就在那，就在那，那美丽的眼睛藏住了一切，还有慌张，她是在等我！没错，她就在那，早已看到了我，而这会却低着头，我几乎就要走向她，向她拿出信，和你，你那硬币的载体，可是！怯弱，还有可恶的惯性，我又径直的走下去了，呼之欲出。假如，她看我一眼，用那美丽的眸子注视一秒我的眼睛，我定将奔向她，用尽我所有的勇气，去换取……幸福，快乐，和爱。可是，我没有，我走了下去。\n但我这不甘的冲动却没让我离开，我在楼下这黑夜里踱步，在这被云半遮的月下，在那朦胧的清辉笼罩的花坛旁不停的来回走动。我不能走，不，我还有机会，她还在上面，在这栋楼的某处。“也许，我应该上去拿本书，对，我必须把我整理的题集拿下来，就现在”我突然回过头来，像是被什么吸引着，我的整个身体被突然的一个念头调动起来，向着楼梯口走去。\n果然，这奇妙的……或许是感应，她又一次出现，和她的同伴从那黑洞般的楼梯口走出，她迅速的，或许是，迅速的看了我一眼，便又把眼神调离，脚步也和往常一样，丝毫没有停止，正如我。这可恨的惯性啊，你是多么的抗拒特殊啊，我的老马。我知道，这平安夜里的最后一次机会，你赐予我的机会，失去了。\n我的心中充满了怒火，对于自己的愤恨，可是到了眼里，却成了泪水。可恶啊，你永远不会成功的！如果老马你依旧这样胆小，厌恶改变，我大概就永远不能看到那惊涛后的彩虹了，就如同所有人一样，满足于重复的生活和黯淡的微光而自得其乐。是的，这对其他人并没有什么不好，可是，可是，如死灰一样的人生，又怎么称得上人生呢？"
 },
 {
  "date": "12月31日",
  "title": "元旦……元旦……",
  "text": "元旦晚会结束后，她上来尝试见我了，但我在班级门口，她却以为我在去往洗手间的那条走廊，因为我们总是这样见面的。我就这样远远的看着她，看着她落寞的离开，毫无办法，我不能去追她，因为，因为……哎。假如她能向我这望一眼，她就会看到我殷切的眼神，但她。\n新的一年，希望她可以快乐而幸福。\n新的一年，我必将坎坷而又艰难。"
 },
 {
  "date": "1月1日",
  "title": "",
  "text": "“因为我把时间倾注在我的玫瑰花身上，所以她才会如此的重要。”\n她不过是一个普通人，也许在其他人看来并没有那么美，那么特殊。但我已经了解她了，她的习惯，小性子，笑的模样，她便成为了我心目中的那朵与众不同的玫瑰花，我时时刻刻挂念的生活的主角。就如同我的“黑格尔”一样，它不过是一条普普通通的奶牛猫，但就算用一只布偶猫来换我也是不会同意的，因为它已经不仅仅是一只奶牛猫，他是“黑格尔”，承载着我无数回忆的黑格尔，他已经成为了我回忆的一部分，也是我的一部分。如果允许的话我可以再养一只，但我绝对不会抛弃他。\n或许，当我们在为逝去的人流泪时，我们并不是为这个生命个体而流泪，而是在为我们两个人所创造的与众不同的回忆而流泪，是在为自己而流泪。"
 },
 {
  "date": "1月2日",
  "title": "",
  "text": "小王子，我该怎么做呢，我多么希望驯养她又或被她驯养，但我们已经没有时间了，再过几天，我就要走了，也许，这将会是我们最后的时间了，我不能突然的靠近她，她会逃跑的，就如同你那胆小的狐狸朋友，但我又不能再等待，没有时间了。"
 },
 {
  "date": "1月3日",
  "title": "",
  "text": "我从未这样渴望着回到学校，看来，是的，我必须走出这一步了，就在寒假之前。否则，我会难过死的。"
 },
 {
  "date": "1月4日",
  "title": "",
  "text": "唉，理性和感性可真是不可协调啊，无论我明白怎样的大道理，明白她多么的爱我，但是，当随意的一个她不爱我的征兆出现，，我还是会难过，还是会伤心啊，理性什么都懂，而感性呢，却脆弱的像个孩子。"
 },
 {
  "date": "1月5日",
  "title": "",
  "text": "今天是新的一年的第一场雪，在上课的时候，雪就飘飘悠悠的落了下来，渐渐的堆积，等下课的时候，雪已经有十几厘米深了。我捧着热水在走廊冰冷的窗户里看着外面的雪，看着学生们在楼下愉快的玩耍，然后我便看到了她。\n她照例穿着她那白色的羽绒服，毛茸茸的帽子扣在她那不大的脑袋瓜上显得格外可爱。当她在与朋友说话时，还时不时的向周围看去。大概是在找我吧，我猜。\n当我透过满是哈气的玻璃注视着她时，渐渐我的眼睛变得朦胧了，我仿佛看到她融在了雪里，像雪一样，她仿佛成了雪中的仙女，每一片雪花都围绕着她起舞，雪花仿佛将阳光都折射到了她的身上。她就像雪，我想。\n我久久的望着她，我从未这样的大胆，但也从未这么长时间的望着她，甚至当我的朋友过来找我时，我都没有把眼睛从她身上离开片刻，随口说着有一搭没一搭的话，心却全在她的身上。"
 },
 {
  "date": "1月6日",
  "title": "",
  "text": "为何你对她日夜思念，却迟迟不靠自己的力量相见呢？这么久了，只靠运气，神会累的，来吧，来吧，别让这可怕的惯性控制你了，改变啊，改变啊，一切都会变好的，只要你走出这一步，走向快乐吧，向这人生的唯一目的前进吧，这至上的快乐是会治愈一切的，你的病，你的痛苦，你的忧伤。"
 },
 {
  "date": "1月7日",
  "title": "",
  "text": "外面漆黑的天空中零星的飘起了雪花，我的思绪却又被这雪带向了她，她多么像雪啊，纯净，洁白，一尘不染，假如我能为她写首小诗该多好啊，可是我的缪斯却总是不知道在哪。"
 },
 {
  "date": "1月9日",
  "title": "致雪",
  "text": "北方的夜里又飘起了雪，\n那雪纯粹而又迷茫。\n它飘在那无人问津的小巷，\n飘向那被寒风冻彻者的心上。\n巷子的角落有个男孩，\n捧起雪花，眼里尽是光芒，\n“你从何处来，又将去向何方？”他想\n他就久久地凝视着雪，直到\n雪在它那温暖的小手中融化，\n变成水，在掌心流淌。\n当我在物理课上认真的听讲时，脑中却突然浮现出了这首小诗的第一句，随后我赶紧在笔下的卷子找着空大的地方，脑中的句子不断地浮现，笔在卷子上龙飞凤舞。当我记完后，我便从头到尾读了读这首小诗。当我又一次重新读了一遍后，突然心头一紧，这到底是怎样可怕的暗示啊，她怎么会融化，怎么会消失呢？我不马上就要与她建立坚实而又稳固的联系了吗？神明，难道你就这样的冷酷无情，连我这生命里仅有的一丝光明也要夺去？什么，你说戛然而止才足够美丽，闭上嘴吧！这是生活，生活啊，不是什么小说，什么戏剧。戏剧要悲伤才深刻，但这是现实啊，我宁愿要快乐，愚蠢而肤浅的快乐也行啊，只要摆脱这痛苦，远离这黑夜。神啊，成全我吧，不要再旁敲侧击，暗示这可怕的命运了。我这可悲的心灵，已经再也承受不了打击了。"
 },
 {
  "date": "1月10日",
  "title": "",
  "text": "我的邻人，唉，每天都在加深我离开的念头，每一秒都在催促我把这想法搬上行程，我能怎么办啊，我难道能够怪罪他们吗不能啊，是我，在影响他们正常的生活，他们的前程，他们所认为决定一生的东西。在这信仰（前进）与人情味，包容与忍耐的矛盾激化之前，我必须要走了，结束这一切。这人生的转折点可能对于我来说比不上生命，可他们呢？我不知道……他们曾一度认为这比生命还要重要啊！"
 },
 {
  "date": "1月11日",
  "title": "",
  "text": "我不知道你为何义无反顾，但我知道，时间已经不多了，真的不多了，我的沙漏中一滴一滴的向下滴着泪，泪在流逝啊。\n假如昨天，我晚一秒出来，仅仅一秒，你便又径直走下去了，我不敢想象，这一切会变成怎样，你又会赌气的远离我，躲着我，也许一天，两天，我的心啊，已经再也承受不了这漫长而又无期的等待了，我没有办法，看呐，尽是痛苦。我对你的印象正在悄悄地改变，被无情的大盗将那快乐的笑容窃去，趁着夜色，替换上了那锐利的冷眼，冷眼啊！将我刺穿，击破我心灵的堤防，倒塌吧！洪水浩荡，泪如雨下。\n我的心中产生了这可怕的恐惧，远离你的念头，可是，每当我窃以为躲过了你，我又无比惊愕于这可怕的做法，他会把我们引入怎样的歧路啊，也许会像那可怕的复仇链永无停息，可是，又有何益呢？对我们各无好处，还会暗暗的把我们的心撕离。我爱你啊，为了你，我忘记了思考，甚至几度与神明不和，它现在正在对着我怄气呢，因为我为了你放弃了理智。可我却从你的脸上看到了无所谓，我不知道你是否还会像从前那样喜欢我，还是仅仅对我无心的垂青。我怕我不再爱你，怕我对你失去感情，让你难过伤心。"
 },
 {
  "date": "1月13日",
  "title": "",
  "text": "国王啊，她多么容易就将你挽回啊，只需要洋溢着快乐的从你身边跑过，总是这样，像蝴蝶般，唉呀，这要我怎么办才好啊。\n我的脑中突然闪过一个想法，一个向她告白的想法，当我在不远的未来与她告白时，除了要把我的信和诗交给她，还有一张小小的纸条，上面写上我爱你，折起来。然后当我第一次与她说上话时，假如可以的话，我便让她从三个中挑一个，如果她贪心的话就一定会挑那封最大的信的，从而知晓我情况的特殊，更好的判断我们是否能够拥有未来和更多的可能性，可是她又怎么知道，最小的里面却装着最重要的东西，哈，是的，还要分三次给她，让她包含着好奇心的对待我们的每一次相见，然后当她最后挑到最小的的时候，当她看到那三个字而脸红心跳的时候，再悄悄地的把话贴在她耳边小声的说出来，我爱你，然后，然后，离开的时候再轻轻的吻她的脸颊。我，真的要这样做吗。可是，是的，勇敢一些吧，你这样的谨慎和胆小不就时因为太过于在乎她了吗，而这时候你只有勇敢的走出这一步才能够拥有她不是吗！\n国王啊，扬起你的鞭儿，冲破这垣墙吧！"
 },
 {
  "date": "1月14日",
  "title": "",
  "text": "多么快乐啊，当我坐在位子上悠悠的想象着我走出这一步后她属于我的样子，我们在河畔的柳树下，你轻轻挽着我的手臂，头歪在我的怀里说着甜甜的悄悄话。李煜啊，我终于明白你了，你本是个“一寸相思千万绪”的痴情儿，“花满渚，酒满瓯，万顷波中得自由。”的世间的流浪者，却偏偏叫你当国理政，这不就像是叫爱因斯坦去当总统似的笑话，但爱因斯坦拒绝了，你却毫无办法。你本是一个自由的艺术家，却又是个肩上扛着数百万黎民百姓生存的当权者，假如你不是…………不，假如他不是，难道他就能一辈子享受着抚琴弄月，佳人在怀的生活？一个艺术家是必须要经受苦难的，他那幸福而又无忧无虑的人生的开端，不就暗示着他成年后的苦难吗。我似乎隐隐约约的窥见了这世界潜在的规则，或许，快乐与愉悦的背后一定暗藏着痛苦，又或者，人的快乐是有一定限制的，一旦超过这个限制，人就会死去。\n于是我似乎明白了节制的重要性，性会带来快乐，但过度的快感会使生命中快乐的限度消耗加快，同样，毒品带来的刺激更加强烈，于是人的生命力被消耗的更加迅速。那么苦行僧或许就是基于这个信条而生存的。\n所以是不是可以说，当我们为了某件事承受了常人无法忍受的痛苦，我们就必定会在这件事上有一定的成果呢？人总不会永远在苦难中生活吧？，会的，就像梵高传教的那个世世代代挖矿维生的小村落，生命力因为环境的恶劣被急剧的压缩，他们永远都处于苦难之中，但，他们麻木了，于是他们便不再痛苦了，肉体受尽折磨而没有做出反抗。是的，他们妥协了，而只要不去试着妥协，不要让精神上的痛苦被习惯抹去而变得麻木，并且一直一直朝着一个目标前行，生活中就一定会有我所期望的快乐出现的。"
 },
 {
  "date": "1月15日",
  "title": "",
  "text": "如果，我是说如果，你已经知道了我的病，假如你实在无法忍受这样的我，就离开吧，不要再上来了，没关系，不用在意我的想法，无论什么都会随时光流逝的，给我点时间，我便会和好如初。我也就不需要去向你表白了。\n晚\n看来，她并没有知道，假如她有心事的话，一眼就可以看得出来的。"
 },
 {
  "date": "1月16日",
  "title": "",
  "text": "你还爱她吗？为什么你想再为她写点东西却什么都写不出，刚刚下课明明看到她了，心里却是一片死寂，你看清她的样子了，……眼睛……下巴，一清二楚，现在还在脑中印着呢，我这是怎么了啊，一片平静，平静。\n国王啊！你怎么了！说话啊！\n寂静……\n……\n我不认识我自己了。"
 },
 {
  "date": "1月17日",
  "title": "",
  "text": "也许……也许……，也许什么啊，你还在也许什么？她难道不爱你了吗？愚蠢！她爱你啊！\n可是，她没见到我也这样的开心，没有我，是的，没有我她也会快乐的，我就是一个恶魔，带给别人的只有痛苦，看呐，只有痛苦，如果没有我，这个世界也许会更好啊，唉啊，我的小世界，你们为什么要闯进来啊，里面只有黑暗，只有黑暗啊，把我赶走吧，让我的世界，这个黑暗的小球在犄角旮旯里败落吧，孤独的败落吧。远离我吧，小心这毒液，可恶的寄生体，它会爬上你们的心房，蚕食你们的心室啊！远离我吧，远离我吧，无辜的人们啊，尽可能地远离我吧。"
 },
 {
  "date": "1月18日",
  "title": "",
  "text": "我刚刚正走在路上，有两个曾被我的病伤害过的人对我指指点点，“就是他啊”，她们在我的背后说道。唉，我必须要离开了，必须要离开了。\n理解\n人不经历过一遍，\n是无法理解别人的心情的。\n往往，\n还对那些深陷痛苦的人嗤之以鼻，\n认为他多么的不如自己。\n理解啊，理解啊！\n求求你们一定要尽可能地理解别人，\n即使不能，\n也请不要猛烈的抨击。\n使别人沦入更危险的的境地。\n无论何样的痛苦都大同小异，\n一旦失去希望，\n人就会渴望死去。\n言行\n一定要尽可能地给予别人希望，\n注意自己的言语，\n因为你不经意的言行，\n可能就会引人入绝望之境，\n面向死亡。\n即使你从未把刀子插入别人的心里。"
 },
 {
  "date": "1月19日",
  "title": "",
  "text": "今天上午我是怎么了，一股莫名的兴奋溜进了我的身体里，我浑身发抖，两条腿颤抖不停，我从未有过这样巨大的勇气，一下课我就冲了出去，我已经计划好了一切，从她上来后的每一句话，每一个动作我都准备好了，我怀着无比坚定的信心认为她一定会上来。我在那楼梯口等着，注意着每一个人，时间一分一秒的流逝，我努力的遏制住自己的颤抖，心脏砰砰乱跳，手里紧紧的握着我所准备的东西，两眼却装作看着楼梯旁的评价表。\n“她还没来，还没来”我不停的走来走去，时间仿佛凝固在了我的身上。一会后，我快要放弃了。\n“再数三十秒,三十秒过后她还没来我就立即离开。”\n我小声的数着，有两个从楼梯上下来的人奇怪的看着我。\n“12，11，10……”\n有两个男生打闹着跑了上来，一个劲的不走，吵吵嚷嚷。\n“3，2……”\n我发现自己明显数慢了，盼望着那一缕白色。随后，那两个男生跑远了。\n“她没有上来”我笑了，对着自己说。\n“真是个疯子。”\n我的朋友从楼梯拐角回来，看到了我。\n“你刚刚上哪了？\n“你没打水吗？”我反问道，试图躲过那个问题。\n“你都没等我，一下课就疯了似的跑出去了，我没打。”\n我没再说话，看了看表，才刚下课五分钟。"
 },
 {
  "date": "1月20日",
  "title": "",
  "text": "时间越来越紧迫，还有六天，最后的六天，我从未如此恐惧放假过，我大概快成一个受虐狂了，只有在不幸中才能安心，而在幸福中，却没完没了的恐惧着幸福的失去。"
 },
 {
  "date": "1月22日",
  "title": "",
  "text": "这几天，我像个世界外的人，什么都不关心，什么都不在乎，除了读我的毛姆之外，就是想着如何给她打造一个浪漫的表白。老师们忧虑的看着我，但却不再劝我了，我知道他们在担心什么，也许我做的这一切所表现出的理所当然已经让他们开始怀疑我做的是否错误了，难道我做对了吗？当然不对啊，上课不听就已经是对于一个老师的极大的不尊重了。"
 },
 {
  "date": "1月23日",
  "title": "",
  "text": "世界外的人啊，你们能感受到什么呢？你们站在自己的世界里，自己艳阳高照的世界里，又怎么能够理解寒冷的痛苦呢，痛彻骨髓，还在夏日里渴望阴凉吧，你们这些世界外的人！你只看到了我呆在那里出神，便报以奇怪的恶名，你们又岂知，我的心里正在被狂风暴雨侵袭，被黑云蔽日！\n理性的边境\n我不能报复，只得伤害自己。\n用外部的疼痛减弱人对内心痛苦的感知。\n我恨不得突然跪下，\n以头抢地。\n杀戮，嘶吼，\n只能稍稍缓解这内心的怒火，\n恼怒，威逼，\n已经给我的理性处以极刑。\n我变成了野兽，饿的发狂，眼冒金星。\n撕扯自己的皮肉，\n以缓解肚中之饥。"
 },
 {
  "date": "1月25日",
  "title": "",
  "text": "又是一天，又是一天，我每一天都在试着去靠近她，每一天都努力的准备好了一切，当我离她远远的时候，她与我的心靠的是那么的近，但一靠近，离她只有那咫尺的距离时，我与她之间厚重的坚壁才渐渐的清晰，然后！我便又可恨的打了退堂鼓，想着，下一次吧，下一次吧。时间！就快要流逝殆尽了啊，你难道能忍受从今往后再也没有她的生活吗，不，明天，无论如何，一定要走出去了！！"
 },
 {
  "date": "1月26日",
  "title": "",
  "text": "当那声低沉的耳语从遥远的空间传到我的耳边时，我才意识到了我的手已经碰到了她的肩膀。“连接”它对我说着。\n“连接……”我重复着。\n她回过头来，惊恐又惊喜的看着我，我盯着她的眼睛。\n“连接”声音依旧在重复。\n我看到她的眼睛躲躲藏藏，嘴巴微微动了一下，头低下，复又抬起，再低下。\n而当她的眼神变得坚毅的那一瞬间，她把头别了过去，跑开了，我愣在原地，信在怀里。\n“连接失败”我喃喃的说道。\n我原以为能再次见到她，交出那封信，但我却再没看到她，直到离开，我不知道到底是怎样，但我知道，结束了。我本以为会大哭一场，可是，我却一滴泪也流不出了，脑子里呢，却像塞了根木头。\n回到家后，我静静的躺在床上，当我在这漆黑的夜里再次告诉自己已经结束了的时候，这生命的虚无感再一次扑面而来，将我淹没。原来，死神从未远离我，他就像一条鬣狗，满嘴里流淌着猩红的血液，那是吞噬了无数的生灵后所剩无几的残渣，它静静的尾随着我，等待着我信仰的失去，一旦我走向某个阴暗的角落，他便咆哮着将我吞噬，咀嚼着我生命的光。\n1月27日 雨\n后记\n如果说我写完就什么都不管了显然有点不负责任，所以作为一个年龄稍长的自己，需要纠正以下几个可能会对孩子们又或是某些深陷艰难处境的人们产生不良影响并且带来严重后果，以防止像《维特》那样被禁止阅读。\n第一点，文中我为自杀正名，是为了理解维特的想法，（事实上文中的大多数文字都是为了理解又或者说试图推导出某些我所感兴趣的独特的思想，比如各种主义，但我自己并不一定信仰这样的主义。）文中自杀的前提是未来将不再有幸福，但事实上我们对于未来的事是很难主观臆断的，往往如同维特所说是因为了人的局限性而导致的无法正确的评估自己的未来，从而主观的自认为未来将没有幸福，然而无论是从历史发展的角度又或是“祸福相依”这样的事物发展的基本准则来看，幸福和苦难一定是相互依存的，也不可能保持不变，所以“快乐的日子总会来临”并不是一厢情愿的自欺欺人，而是有一定科学道理的。假如说了一通还是没有撼动你的想法的话，那么我还是说自己吧，痛苦已经过去了，一切都在朝着好的方向前进。\n第二点，关于我通篇似乎一直在旁敲侧击的考试和教育制度，我起初并没有想去批判，去挑毛病，但当我作为班干部时的某一次思考中，思考为什么我们班里的同学总是有一些不想学习，到底该怎样从根本上从精神层面解决这个问题时，我突然意识到了这个教育系统的局限性。\n并且在后来那段不断思考，不断前进的途中，我意识到它一直在阻碍着我，限制着我，告诉我我现在应当做什么和不做什么，使我越发讨厌和反感这样一种没有人情味的大东西。但这么久了当我理解了越来越多的社会现实和矛盾后，我才逐渐的明白，发现问题很简单，但解决问题很难，当我换位思考到了这些决策者身上后，我便逐渐意识到了其中的难点。而对我启发最大的则是我忘了从哪看的这样一句话，它很好的将我的立场换位到了这些不苟言笑不食人间烟火所以不容易被理解的人们身上：“这些人呐，只知道说这样不行，那样不行，到头来说了一通，把它批判成了一坨狗屎，却一个能用的办法也没有。”\n于是我决定从发现问题解决问题的角度来重新像苏格拉底推理想国一样推一下教育制度，并且试图去寻找解决的方向和方法。\n甲：考试是做什么用的？\n乙：我认为是合理的分配教育资源的，中国有2.7亿的在校生，却只有1600万的老师，老师是远远不够的。\n甲：可是我明明看到了很多问题，比如死板，否认人的多样性，目标统一过于功利，不是为了人的发展而是为了教育而教育等等，难道就非要学这些没用的东西不成？虽然我迷茫，但我知道这些不是我所需要的。\n乙：难道你有更好的办法吗？\n甲：怎么连你也开始说这种话了，我没有，但难道不能更加的多样化一点吗，考察的东西变得更多一些，更加丰富一些，对人的包容度也更高一些。\n乙：你的想法是很好的，但我想，这是很难的，包容度更高代表着考试的科目变得更多，仅仅是这一点就需要更多的师资力量和更多的评判标准，并且很多情况下比如艺术类考试，就很可能会由于欣赏水平的不同而导致几个人产生多种截然不同的评判标准，既然没法统一，就会产生腐败，考试最重要的是选拔，而最难的则是公平，我想你应该明白人性在资本面前会显得多么脆弱。\n而假如要实现你所说的多样化，首先需要考试的公平，而要实现考试的公平不仅仅是要加强监管教育选拔人员，还需要的是整个社会风尚的改变，不再过度的崇尚资本，崇尚权力。（事实上在这个社会主义的初级阶段，物质资源的积累时期，是需要人们崇尚资本的）使人性不会被那么容易被资本控制，但反过来人的问题和社会的问题究其根本还是教育的问题，如果教育的方向改变，社会的整体精神层次和价值观也会改变。所以说如果要改变社会，就需要改变教育，但假如要改变教育，却需要的是社会的改变。\n但难道就这样成为了一个无法改变的闭环了吗？一定要某一方在某种情况下突然改变来迫使另一方变化吗？很幸运不是的，我们身处于中国特色的社会主义国家中，就会有它的优势，而这种优势则是前瞻性。资本是附庸于人的需求的，这毋庸置疑，但对于人们还没有发掘的需求，人们暂时还不需要的需求，对于资本来说则是无能为力的，只有当人们存在需求时，资本才有市场，只有这时候社会才能够前进。\n而我们，则可以通过对于现在而言似乎并没有太大需求，对于“现在人们对孩子们教育的目的”作用不大的教育，在应试教育的过程中添加一些个人教育的东西来渐渐改变人们的价值趋向，尽管可能一开始在应试教育的大环境下会碰壁，但总会有人从中得到改变，而这些人则是舆论和思想的种子，是还未燃起的星星之火，于是在这些具有着新思想新的价值观的人渐渐扩大的过程中，在矛盾变得越来越激烈的过程中，便是使我们能够凭借其一步一步更好的改革的过程，也许会需要很久，事实上的确需要很久，这需要几代人的努力。\n甲：既然考试是这个闭环的连接点，那如果不考试呢？不考试就不会有公平的问题了不是吗？通过某一种方式替代考试，这样有没有可能呢？\n乙：从现在来看你所说的替代考试是很困难的，但在一定程度上从个人心理角度冲淡考试的权重是很有可能的。现代社会随着互联网应用的迅速发展，教育资源的共享已经逐渐被人们所认可，所以考试的大前提有限的教育资源似乎逐渐的不再成立，并且经过了这次疫情，人们也逐渐意识到实现互联网教育普及化的可能性，为互联网教育奠定舆论基础。但通过我的自身经历来看，互联网教育相较于普通的课堂教育一大突出的特征就是自主性，而自主的学习在现在的教育模式下显然是很难的，人们因为兴趣而自主，因为求知欲而求知，但现在显然不是以兴趣为导向的教育模式是很难进行学生的自主学习的。并且很大程度上也无法保证质量。\n还有一个非常需要讨论的点就是科技能否替代老师，而关于这个问题，我想是否定的。这里的老师是作为一个概念而不是一个群体，当人们需要有人来解答自己的问题的时候，老师可以是同学，可以是学长，也可以是某个网上的朋友，这样的老师是不可能消失的，在网上上传教育资源的老师也是不可能消失的，还有精神层面的人生导师，尽管现在还没有普及，但未来一定会成为一个必需品。\n甲：你又跑题了，我们讨论的明明是考试的必要性，结果你却绕来绕去的打马虎眼，你就告诉我考试有没有可能消失吧\n乙：彻底的消失是不可能的，但你也知道物极必反，当一个事物走向极端时就会有另一股力量将其遏制然后再走向另一个极端（在不受控制的情况下），而现在的教育则是这样，在那些半军事化管理的中学中，我们能够看到的最显著的一点就是在信仰支撑下的“极限的秩序”，而无论是社会还是教育都有一个不可改变的永久存在的矛盾“机械性（秩序）与人情味（自由）”的矛盾，因为秩序会使公司更具竞争力，政府更加廉洁，提高社会前进的进程。而人与人之间的人情味则会破坏这些，追求关系 ，特殊性，一片虚假的祥和以至和平积弊。但人的幸福感又往往来源于此，没有人不追求幸福，并且同样社会发展的最终目的也是为了使所有的人获得幸福，同时也要使这个时代的人获得幸福。于是便形成了矛盾，而对于矛盾我们的解决方式只能寻求中庸，找到一个平衡的点。所以教育以后必然会渐渐向平衡的自由，走向人的教育。"
 }
];

    return;
  }
  document.getElementById('wrap').style.display = 'grid';

  var entries = DIARY_DATA;
  var idx = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function renderList() {
    var ul = document.getElementById('dList');
    document.getElementById('dCount').textContent = entries.length + ' 篇';
    ul.innerHTML = entries.map(function (e, i) {
      var label = e.date || '前言';
      var sub = (e.title && e.date) ? e.title : '';
      return '<li><a href="#' + i + '" data-i="' + i + '">' + esc(label) +
        (sub ? '<span class="t">' + esc(sub) + '</span>' : '') + '</a></li>';
    }).join('');
  }

  function renderArticle(i) {
    idx = i;
    var e = entries[i];
    var paras = (e.text || '').split('\n').filter(function (p) { return p.trim(); });
    var html = '<article class="d-article">';
    html += '<div class="d-date">' + esc(e.date || '前言') + '</div>';
    if (e.title) html += '<div class="d-title">' + esc(e.title) + '</div>';
    html += '<div class="d-divider"></div>';
    html += '<div class="d-text">' + paras.map(function (p) {
      return '<p>' + esc(p) + '</p>';
    }).join('') + '</div>';
    html += '</article>';
    document.getElementById('dContent').innerHTML = html;

    document.getElementById('dPrev').disabled = (i <= 0);
    document.getElementById('dNext').disabled = (i >= entries.length - 1);

    Array.prototype.forEach.call(document.querySelectorAll('.d-list a'), function (a) {
      a.classList.toggle('active', Number(a.dataset.i) === i);
    });
    var active = document.querySelector('.d-list a.active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('dPrev').addEventListener('click', function () {
    if (idx > 0) renderArticle(idx - 1);
  });
  document.getElementById('dNext').addEventListener('click', function () {
    if (idx < entries.length - 1) renderArticle(idx + 1);
  });

  document.getElementById('dList').addEventListener('click', function (ev) {
    var a = ev.target.closest('a');
    if (!a) return;
    ev.preventDefault();
    renderArticle(Number(a.dataset.i));
  });

  window.addEventListener('scroll', function () {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    var p = h > 0 ? (window.scrollY / h) * 100 : 0;
    document.getElementById('dBar').style.width = p + '%';
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' && idx > 0) renderArticle(idx - 1);
    if (e.key === 'ArrowRight' && idx < entries.length - 1) renderArticle(idx + 1);
  });

  renderList();
  var start = parseInt((location.hash || '').replace('#', ''), 10);
  renderArticle(isNaN(start) ? 0 : Math.min(Math.max(start, 0), entries.length - 1));
})();
</script>
</body>
</html>
